            }
        }

        if (this.floorLevel > 0 && !cityMap.getBuildingAt(this.x, this.y)) {
            this.floorLevel = 0;
            this.z = 0;
        }

        const inCold = cityMap.isInColdZone(this.x, this.y);
        const inHotDesert = cityMap.isInDesert(this.x, this.y);
        if (inCold) this.bodyTemperature = Math.max(0, this.bodyTemperature - 1.45 * dt);
        else if (inHotDesert) this.bodyTemperature = Math.min(SURVIVAL_CONFIG.MAX_BODY_TEMPERATURE, this.bodyTemperature + 0.82 * dt);
        else this.bodyTemperature += Math.sign(70 - this.bodyTemperature) * Math.min(Math.abs(70 - this.bodyTemperature), 0.9 * dt);
        if (this.bodyTemperature <= 0) this.health = Math.max(0, this.health - 2.2 * dt);
        if (this.bodyTemperature >= SURVIVAL_CONFIG.MAX_BODY_TEMPERATURE) this.health = Math.max(0, this.health - 1.6 * dt);
        this.environmentWarningCooldown = Math.max(0, this.environmentWarningCooldown - dt);
        if (this.environmentWarningCooldown <= 0 && this.bodyTemperature < 25) {
            statusMsg = '🥶 你正在失溫！離開雪地並盡快取暖。';
            this.environmentWarningCooldown = 8;
        } else if (this.environmentWarningCooldown <= 0 && this.bodyTemperature > 90) {
            statusMsg = '🥵 高溫與乾旱正在耗損你的體力，請離開沙漠並補充飲水。';
            this.environmentWarningCooldown = 8;
        }

        // 5. 換彈冷卻倒數
        if (this.cooldownTimer > 0) {
            this.cooldownTimer -= dt;
        }
        if (this.isReloading) {
            this.reloadTimer -= dt;
            if (this.reloadTimer <= 0) {
            this.finishReload(inventory);
            }
        }

        // 6. 換彈觸發 (R 鍵)
        if (input.isReloadTriggered() && !this.isReloading) {
            this.startReload(inventory, input.selectedHotbarIndex);
        }

        // 7. 快捷欄物資直接使用或播種 (當選擇種子、食物/藥品或工作台時)
        const activeSlot = inventory.hotbar[input.selectedHotbarIndex];
        const groundLootTarget = game?.aimTarget?.kind === 'ground_loot' ? game.aimTarget.object : null;
        if (groundLootTarget && input.isRightClickTriggered()) statusMsg = this.pickupGroundLoot(groundLootTarget, inventory, game);
        const targetCanBreak = game?.aimTarget && ['harvestable', 'tree', 'rock', 'salvage'].includes(game.aimTarget.kind);
        const isBreakingTarget = targetCanBreak && input.isAttackPressed() && cityMap.isWithinPlacementRange(
            Math.round(game.aimTarget.object.x), Math.round(game.aimTarget.object.y), this.x, this.y);
        if (targetCanBreak) {
            const breakMsg = this.handleDestruction(interactionDt, input, game.aimTarget, cityMap, inventory, game);
            if (breakMsg) statusMsg = breakMsg;
        } else {
            this.harvestingTarget = null;
            this.harvestProgress = 0;
            this.harvestDuration = 0;
        }
        const isFunctionalItem = activeSlot?.type === 'item' && ['food', 'drink', 'medical'].includes(activeSlot.itemDef.category);
        if (isFunctionalItem && input.isRightMouseDown && !groundLootTarget && !game?.lootingContainer && !this.itemUseCompletedThisHold) {
            if (this.itemUseHotbarIndex !== input.selectedHotbarIndex) {
                this.itemUseHotbarIndex = input.selectedHotbarIndex;
                this.itemUseProgress = 0;
            }
            this.itemUseProgress = Math.min(this.itemUseDuration, this.itemUseProgress + interactionDt);
            if (this.itemUseProgress >= this.itemUseDuration) {
                const useResult = inventory.useHotbarItem(input.selectedHotbarIndex, this);
                statusMsg = useResult || 'ℹ️ 目前不需要使用這項物品。';
                this.itemUseProgress = 0;
                this.itemUseHotbarIndex = null;
                this.itemUseCompletedThisHold = true;
            }
        } else {
            this.itemUseProgress = 0;
            this.itemUseHotbarIndex = null;
            if (!input.isRightMouseDown || groundLootTarget || !isFunctionalItem) this.itemUseCompletedThisHold = false;
        }

        if (activeSlot && activeSlot.type === 'item') {
            if (input.isRightClickTriggered() && groundLootTarget) {
                // 右鍵已用於撿起準星下的地面物資。
            } else if (input.isRightClickTriggered() && !game?.lootingContainer) {
                if (activeSlot.itemDef.category === 'seed') {
                    statusMsg = this.plantSeed(activeSlot.id, cityMap, inventory, game?.aimWorld, input.selectedHotbarIndex);
                } else if (activeSlot.itemDef.category === 'deployable') {
                    statusMsg = this.deployWorkbench(activeSlot.itemDef.id, cityMap, inventory, barricades, game?.aimWorld, input.selectedHotbarIndex);
                }
            } else if (input.isAttackTriggered() && !targetCanBreak && activeSlot.itemDef.toolType === 'hoe') {
                statusMsg = this.tillSoil(cityMap, game?.aimWorld);
            } else if (input.isAttackTriggered() && !targetCanBreak) {
                // 食物、飲品與醫療用品改為右鍵長按使用。
            }
        } else if (activeSlot && activeSlot.type === 'weapon') {
            if (input.isAttackPressed() && !isBreakingTarget) {
                this.handleWeaponAttack(activeSlot, bullets, particles, inventory);
            }
        }

        // 8. 建造防禦拒馬快捷鍵 (B 鍵)
        if (input.isBuildTriggered()) {
            if (inventory.canBuildBarricade()) {
                const bx = Math.round(this.x + Math.cos(this.aimAngle) * 1.1);
                const by = Math.round(this.y + Math.sin(this.aimAngle) * 1.1);

                if (cityMap.isWalkable(bx, by, 0.45) && !barricades.some(b => b.x === bx && b.y === by && b.isActive)) {
                    inventory.consumeBarricadeMaterials();
                    barricades.push(new Barricade(bx, by, 180, 'barricade'));
                    statusMsg = '🛠️ 已成功部署木製防禦拒馬！';
                } else {
                    statusMsg = '❌ 此處無法建造拒馬 (已有障礙物)';
                }
            } else {
                statusMsg = '⚠️ 建材不足！建造拒馬需要 2 塊加固木板。';
            }
        }

        // 9. 容器搜刮交互 / 平常按 E 開啟背包
        const stair = cityMap.getStairwellAt(this.x, this.y);
        if (!stair) this.lastStairwellId = null;
        const stairMsg = stair && stair.buildingId !== this.lastStairwellId
            ? cityMap.useStairwell(Math.round(this.x), Math.round(this.y), this)
            : null;
        if (stairMsg && stair) this.lastStairwellId = stair.buildingId;
        statusMsg = stairMsg || this.handleContainerInteraction(interactionDt, input, cityMap.containers, game) || statusMsg;

        return statusMsg;
    }

    /**
     * 在前方耕地播種種子
     */
    plantSeed(seedItemId, cityMap, inventory, aimWorld = null, hotbarIndex = null) {
        const frontX = Number.isFinite(aimWorld?.wx) ? Math.round(aimWorld.wx) : Math.round(this.x + Math.cos(this.aimAngle) * 0.9);
        const frontY = Number.isFinite(aimWorld?.wy) ? Math.round(aimWorld.wy) : Math.round(this.y + Math.sin(this.aimAngle) * 0.9);

        if (frontX < 0 || frontX >= cityMap.cols || frontY < 0 || frontY >= cityMap.rows) {
            return '❌ 超出地圖範圍，無法播種！';
        }

        if (!cityMap.isWithinPlacementRange(frontX, frontY, this.x, this.y)) {
            return '❌ 播種位置需在玩家周圍 5×5 格內。';
        }

        const tile = cityMap.grid[frontX][frontY];
        const canPlant = tile === TILE_TYPES.WET_SOIL || tile === TILE_TYPES.FARMLAND_SOIL;
        if (!canPlant) {
            return '❌ 土地尚未開墾！先裝備鋤頭，在草地上按左鍵整地。';
        }

        cityMap.containers = cityMap.containers.filter(c => !((c.type.startsWith('crop_') || c.type === 'crops') && c.isLooted && Math.round(c.x) === frontX && Math.round(c.y) === frontY));
        const hasCrop = cityMap.containers.some(c => Math.round(c.x) === frontX && Math.round(c.y) === frontY && (!c.isLooted || ['storage_box', 'research_table'].includes(c.type))) ||
                        cityMap.growingCrops.some(c => Math.round(c.x) === frontX && Math.round(c.y) === frontY);
        if (hasCrop) {
            return '⚠️ 此處已經有作物或容器存在！';
        }

        const itemDef = ITEMS[seedItemId];
        if (!itemDef) return '❌ 無效種子';

        inventory.removeItem(seedItemId, 1, hotbarIndex);
        cityMap.plantCrop(frontX, frontY, itemDef.cropType, itemDef.name.replace('種子包', ''));
        return `🌱 成功播種【${itemDef.name}】！約 35 秒後成熟可採收。`;
    }

    tillSoil(cityMap, aimWorld = null) {
        const x = Number.isFinite(aimWorld?.wx) ? Math.round(aimWorld.wx) : Math.round(this.x + Math.cos(this.aimAngle) * 0.9);
        const y = Number.isFinite(aimWorld?.wy) ? Math.round(aimWorld.wy) : Math.round(this.y + Math.sin(this.aimAngle) * 0.9);
        if (!cityMap.isWithinPlacementRange(x, y, this.x, this.y)) return '❌ 開墾位置需在玩家周圍 5×5 格內。';
        if (x < 0 || x >= cityMap.cols || y < 0 || y >= cityMap.rows) return '❌ 這裡無法開墾。';
        const tile = cityMap.grid[x][y];
        if (tile === TILE_TYPES.FARMLAND_SOIL || tile === TILE_TYPES.WET_SOIL) return 'ℹ️ 這塊土地已經開墾好了。';
        if (tile !== TILE_TYPES.GRASSLAND) return '❌ 鋤頭只能開墾草原土地。';
        const occupied = cityMap.containers.some(c => Math.round(c.x) === x && Math.round(c.y) === y && !c.isLooted) ||
            cityMap.growingCrops.some(c => Math.round(c.x) === x && Math.round(c.y) === y);
        if (occupied) return '❌ 先清除這塊土地上的物件。';
        cityMap.grid[x][y] = TILE_TYPES.FARMLAND_SOIL;
        return '🪏 土地已開墾，可以裝備種子播種。';
    }

    /**
     * 部署木工工作台
     */
    deployWorkbench(workbenchId, cityMap, inventory, barricades, aimWorld = null, hotbarIndex = null) {
        const frontX = Number.isFinite(aimWorld?.wx) ? Math.round(aimWorld.wx) : Math.round(this.x + Math.cos(this.aimAngle) * 1.0);
        const frontY = Number.isFinite(aimWorld?.wy) ? Math.round(aimWorld.wy) : Math.round(this.y + Math.sin(this.aimAngle) * 1.0);

        if (!cityMap.isWithinPlacementRange(frontX, frontY, this.x, this.y)) {
            return '❌ 放置位置需在玩家周圍 5×5 格內。';
        }
        if (!cityMap.isValidPlacementTile(frontX, frontY) || barricades.some(b => Math.round(b.x) === frontX && Math.round(b.y) === frontY && b.isActive)) {
            return '❌ 此處無法部署工作台 (空間不足或有障礙物)';
        }

        if (cityMap.containers.some(c => Math.round(c.x) === frontX && Math.round(c.y) === frontY && (!c.isLooted || ['storage_box', 'research_table'].includes(c.type))) ||
            cityMap.growingCrops.some(c => Math.round(c.x) === frontX && Math.round(c.y) === frontY)) {
            return '❌ 這個格子已有物品，請選擇空地。';
        }

        inventory.removeItem(workbenchId, 1, hotbarIndex);
        if (workbenchId === 'storage_box' || workbenchId === 'research_table') {
            cityMap.placeStorageBox(frontX, frontY, workbenchId);
            if (workbenchId === 'research_table') return '🧪 已放置研究台；將配方所需材料放入其中即可解鎖配方。';
            return '📦 已放置木製儲物箱，瞄準後按 E 可存取物資。';
        }
        barricades.push(new Barricade(frontX, frontY, 260, workbenchId));
        if (workbenchId === 'power_wire') return '〰️ 已放置電線；將它連接到發電機或蓄電池以建立電網。';
        if (workbenchId === 'battery') return '🔋 已放置蓄電池；連上發電機後開始充電。';
        if (workbenchId === 'wind_generator') {
            barricades[barricades.length - 1].maxHealth = 420;
            barricades[barricades.length - 1].health = 420;
            return '🌬️ 風力發電機開始運轉，周圍 12 格已供電。';
        }
        return workbenchId === 'metal_workbench' ? '⚒️ 已部署金屬加工台！靠近可製作進階裝備。' : '🛠️ 已部署木工工作台！靠近可製作金屬加工台。';
    }

    handleDestruction(dt, input, target, cityMap, inventory, game = null) {
        if (!input.isAttackPressed() || !cityMap.isWithinPlacementRange(
            Math.round(target.object.x), Math.round(target.object.y), this.x, this.y)) {
            this.harvestingTarget = null;
            this.harvestProgress = 0;
            this.harvestDuration = 0;
            return null;
        }
        const requiredTools = target.requiredTools || (target.requiredTool ? [target.requiredTool] : []);
        const heldToolType = inventory.hotbar[input.selectedHotbarIndex]?.itemDef?.toolType;
        if (requiredTools.length && !requiredTools.includes(heldToolType)) {
            this.harvestingTarget = null;
            this.harvestProgress = 0;
            this.harvestDuration = 0;
            if (input.isAttackTriggered()) {
                const toolName = requiredTools.map(tool => ITEMS[tool]?.name || tool).join('或');
                return requiredTools.some(tool => inventory.hasTool(tool)) ? `請先選取快捷欄中的${toolName}。` : `需要${toolName}才能採集這項資源。`;
            }
            return null;
        }
        if (target.kind === 'salvage' && heldToolType === 'welding_torch' && !game?.isGeneratorPowering(this.x, this.y)) {
            this.harvestingTarget = null;
            this.harvestProgress = 0;
            this.harvestDuration = 0;
            return input.isAttackTriggered() ? '⚡ 電焊槍已修復，但需要在運轉中的發電機附近供電。' : null;
        }
        if (this.harvestingTarget !== target.object) {
            this.harvestingTarget = target.object;
            this.harvestProgress = 0;
            this.harvestDuration = 0;
        }
        this.harvestProgress += dt;
        const equippedTool = inventory.hotbar[input.selectedHotbarIndex]?.itemDef;
        const toolSpeed = requiredTools.includes(equippedTool?.toolType) ? (equippedTool.harvestSpeed || 1) : 1;
        const duration = (target.kind === 'harvestable' ? 0.75 : (target.kind === 'tree' ? 2.0 : (target.kind === 'salvage' ? 2.6 : 1.35))) / toolSpeed;
        this.harvestDuration = duration;
        if (this.harvestProgress < duration) return null;
        this.harvestingTarget = null;
        this.harvestProgress = 0;

        if (target.kind === 'harvestable') {
            const container = target.object;
            container.ensureLootGenerated();
            let collected = 0;
            for (let i = container.items.length - 1; i >= 0; i--) {
                const entry = container.items[i];
                if (this.inventoryCanReceive(inventory, entry.item, entry.count)) {
                    inventory.addItem(entry.item, entry.count);
                    game?.selectNewPlaceable(entry.item);
                    collected += entry.count;
                    container.items.splice(i, 1);
                }
            }
            if (container.items.length === 0) {
                container.isLooted = true;
                const isCrop = container.type.startsWith('crop_') || container.type === 'crops';
                if (isCrop) {
                    const cropX = Math.round(container.x), cropY = Math.round(container.y);
                    cityMap.growingCrops = cityMap.growingCrops.filter(c => Math.round(c.x) !== cropX || Math.round(c.y) !== cropY);
                    cityMap.containers = cityMap.containers.filter(c => c !== container);
                    cityMap.grid[cropX][cropY] = TILE_TYPES.FARMLAND_SOIL;
                }
            }
            return collected ? `🌾 已收穫 ${container.name}，取得 ${collected} 件物資。` : '⚠️ 背包空間不足，收穫物仍留在原地。';
        }

        const prop = target.object;
        const isTree = target.kind === 'tree';
        const isCoalVein = prop.type === 'coal_vein';
        const isSalvage = target.kind === 'salvage';
        const isGenerator = target.object.type === 'generator_wreck';
        const amount = isSalvage ? (target.object.type === 'car_wreck' ? 4 + Math.floor(Math.random() * 4) : 5 + Math.floor(Math.random() * 5)) :
            (isCoalVein ? 3 + Math.floor(Math.random() * 5) : (isTree ? 2 + Math.floor(Math.random() * 3) : 1 + Math.floor(Math.random() * 3)));
        const drops = isGenerator
            ? [
                { itemDef: ITEMS.generator_parts, count: 2 + Math.floor(Math.random() * 3) },
                { itemDef: ITEMS.scrap_metal, count: 2 + Math.floor(Math.random() * 3) }
            ]
            : [{ itemDef: ITEMS[isSalvage ? 'scrap_metal' : (isCoalVein ? 'coal' : (isTree ? 'wood_plank' : 'stone'))], count: amount }];
        if (!inventory.canAddItems(drops)) return '⚠️ 背包空間不足，無法破壞並收集物資。';
        const propIndex = cityMap.scenery.indexOf(prop);
        if (propIndex >= 0) cityMap.scenery.splice(propIndex, 1);
        cityMap.grid[prop.x][prop.y] = prop.groundTile ?? TILE_TYPES.FOREST_FLOOR;
        for (const drop of drops) inventory.addItem(drop.itemDef, drop.count);
        if (isGenerator) return `⚙️ 發電機已拆解，取得發電機零件 x${drops[0].count}、廢金屬 x${drops[1].count}。`;
        if (isSalvage) return `🔧 拆解完成，取得廢金屬 x${amount}。`;
        if (isCoalVein) return `⛏️ 採出煤炭 x${amount}。`;
        if (prop.type === 'timber_stack') return `🪚 回收木料 x${amount}。`;
        return isTree ? `🪓 樹木已砍倒，取得木板 x${amount}。` : `⛏️ 岩石已敲碎，取得石塊 x${amount}。`;
    }

    inventoryCanReceive(inventory, item, count) {
        return inventory.canAddItem(item, count);
    }

    pickupGroundLoot(loot, inventory, game = null) {
        if (!game?.cityMap?.isWithinPlacementRange(Math.round(loot.x), Math.round(loot.y), this.x, this.y)) {
            return '走近地面物資後再按右鍵拾取。';
        }
        loot.ensureLootGenerated();
        let collected = 0;
        for (let i = loot.items.length - 1; i >= 0; i--) {
            const entry = loot.items[i];
            if (!inventory.canAddItem(entry.item, entry.count)) continue;
            inventory.addItem(entry.item, entry.count);
            game?.selectNewPlaceable(entry.item);
            collected += entry.count;
            loot.items.splice(i, 1);
        }
        if (loot.items.length === 0) loot.isLooted = true;
        return collected ? `🎒 撿起${loot.name}，取得 ${collected} 件物資。` : '⚠️ 背包空間不足，物資仍留在地上。';
    }

    getScreenSpeedScale(worldX, worldY) {
        const halfW = ISO_CONFIG.TILE_WIDTH / 2;
        const halfH = ISO_CONFIG.TILE_HEIGHT / 2;
        const screenX = (worldX - worldY) * halfW;
        const screenY = (worldX + worldY) * halfH;
        const projectedSpeed = Math.hypot(screenX, screenY);
        return projectedSpeed > 0 ? (Math.SQRT2 * halfW) / projectedSpeed : 1;
    }

    tryMove(dx, dy, cityMap, barricades) {
        const nextX = this.x + dx;
        if (cityMap.isWalkable(nextX, this.y, this.radius) && !this.checkBarricadeCollision(nextX, this.y, barricades)) {
            this.x = nextX;
        }
        const nextY = this.y + dy;
        if (cityMap.isWalkable(this.x, nextY, this.radius) && !this.checkBarricadeCollision(this.x, nextY, barricades)) {
            this.y = nextY;
        }
    }

    checkBarricadeCollision(x, y, barricades) {
        for (const b of barricades) {
            if (b.type === 'power_wire') continue;
            if (b.isActive && Math.hypot(b.x - x, b.y - y) < (b.radius + this.radius)) {
                return true;
            }
        }
        return false;
    }

    handleWeaponAttack(activeSlot, bullets, particles, inventory) {
        if (this.cooldownTimer > 0 || this.isReloading) return;

        const wDef = activeSlot.weaponDef;

        if (wDef.type === 'melee') {
            this.cooldownTimer = wDef.cooldown;
            this.isSwingingMelee = true;
            this.swingProgress = 0;
            this.meleeDef = wDef;
        } else if (wDef.type === 'ranged') {
            if (activeSlot.loadedAmmo > 0) {
                activeSlot.loadedAmmo--;
                this.cooldownTimer = wDef.fireRate;

                const baseAngle = this.aimAngle;
                const pellets = wDef.pellets || 1;

                for (let i = 0; i < pellets; i++) {
                    const spread = (Math.random() - 0.5) * (wDef.spread || wDef.accuracy || 0.05);
                    const bulletAngle = baseAngle + spread;
                    bullets.push(new Bullet({
                        x: this.x,
                        y: this.y,
                        z: 0.4,
                        angle: bulletAngle,
                        speed: wDef.bulletSpeed,
                        damage: wDef.damage,
                        range: wDef.range
                    }));
                }

                particles.addMuzzleFlash(
                    this.x + Math.cos(baseAngle) * 0.45,
                    this.y + Math.sin(baseAngle) * 0.45,
                    baseAngle
                );
            } else {
                this.startReload(inventory, inventory.hotbar.indexOf(activeSlot));
            }
        }
    }

    startReload(inventory, hotbarIndex = 0) {
        const activeSlot = inventory.hotbar[hotbarIndex];
        if (!activeSlot || activeSlot.type !== 'weapon' || activeSlot.weaponDef.type !== 'ranged') {
            return;
        }

        const wDef = activeSlot.weaponDef;
        if (activeSlot.loadedAmmo >= wDef.magSize) return;

        const reserveAmmo = inventory.getItemCount(wDef.ammoType);
        if (reserveAmmo <= 0) return;

        this.isReloading = true;
        this.reloadTimer = wDef.reloadTime;
        this.reloadingHotbarIndex = hotbarIndex;
    }

    finishReload(inventory) {
        this.isReloading = false;
        const activeSlot = inventory.hotbar[this.reloadingHotbarIndex];
        this.reloadingHotbarIndex = null;
        if (!activeSlot || activeSlot.type !== 'weapon' || activeSlot.weaponDef.type !== 'ranged') {
            return;
        }

        const wDef = activeSlot.weaponDef;
        const needed = wDef.magSize - activeSlot.loadedAmmo;
        const available = inventory.getItemCount(wDef.ammoType);
        const toLoad = Math.min(needed, available);

        if (toLoad > 0) {
            inventory.removeItem(wDef.ammoType, toLoad);
            activeSlot.loadedAmmo += toLoad;
        }
    }

    /**
     * 容器搜刮交互邏輯與平常按下 E 鍵開啟隨身背包
     */
    handleContainerInteraction(dt, input, containers, game = null) {
        const aimed = game?.aimTarget?.kind === 'container' ? game.aimTarget.object : null;
        const nearby = aimed && containers.includes(aimed) &&

                { x: 153 + (Math.random() - 0.5) * 2, y: 223 },

    triggerHordeEvent() {

                if (!this.hasNightHordeTriggered) {
                    this.hasNightHordeTriggered = true;
                    this.triggerHordeEvent();
                    hordeAlert = 'HORDE_TRIGGER';
                }

                // 常態夜間維持高威脅數量
                if (!this.isHordeActive && this.zombies.length < DAY_NIGHT_CONFIG.NIGHT_MAX_NATURAL_ZOMBIES) {
                    this.spawnRandomZombie(true);
                }
            } else if (isDusk) {
                // 黃昏：為入夜屍潮做準備
                this.hasNightHordeTriggered = false;
            } else if (isDay) {
                // 白天：重置夜襲標記，維持低密度 (最多 7 隻)，屍潮自動平息
                this.hasNightHordeTriggered = false;
                this.isHordeActive = false;
                this.isHordeWarning = false;

                if (this.zombies.length < DAY_NIGHT_CONFIG.DAY_MAX_NATURAL_ZOMBIES) {

        // 4. 子彈與喪屍精確圓形碰撞
        for (const bullet of bullets) {
            if (!bullet.isActive) continue;

            for (const z of this.zombies) {
                if (!z.isActive) continue;

                const hitDist = bullet.distanceTo(z);
                if (hitDist <= (z.radius + bullet.radius)) {
                    bullet.isActive = false;
                    const hitAngle = Math.atan2(bullet.vy, bullet.vx);
                    particles.addBlood(z.x, z.y, hitAngle, 8);

                    const isDead = z.takeDamage(bullet.damage, hitAngle, 1.2);
                    if (isDead) {
                        totalKilled++;
                        gainedScore += z.config.score;
                    }
                    break;
                }
            }
        }

        // 5. 更新每隻喪屍 AI
        for (let i = this.zombies.length - 1; i >= 0; i--) {
            const z = this.zombies[i];
            if (!z.isActive) {
                this.zombies.splice(i, 1);
                continue;
            }
            z.update(dt, player, cityMap, barricades, this.isHordeActive, timeSystem);
        }

        return {
            killed: totalKilled,
            score: gainedScore,
            hordeAlert
        };
    }
}

        }
        for (const slot of this.items) {
            if (slot?.id === itemDef.id) space += Math.max(0, itemDef.maxStack - slot.count);

            for (const slot of slots) {
                if (slot?.id !== itemDef.id) continue;
                const added = Math.min(remaining, itemDef.maxStack - slot.count);

                remaining -= added;
                if (remaining <= 0) break;

            for (let i = 0; remaining > 0 && i < slots.length; i++) {

        for (let i = 0; i < 5; i++) {
            const a = angle + (i - 2) * 0.2;
            this.particles.push({
                x: x + Math.cos(a) * 0.3,
                y: y + Math.sin(a) * 0.3,
                z: 0.35,
                vx: Math.cos(a) * 2,

    update(dt) {

        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.life -= dt;
            if (p.life <= 0) {
                this.particles.splice(i, 1);

        }

        // 浮動文字
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {

    renderGround(ctx, camera) {

        for (const s of this.bloodStains) {
            const { x: sx, y: sy } = IsoEngine.worldToScreen(s.x, s.y, 0, camera);
            if (!IsoEngine.isVisible(sx, sy, 20, ctx.canvas.width, ctx.canvas.height)) continue;

            ctx.fillStyle = `rgba(153, 27, 27, ${s.alpha})`;
            ctx.beginPath();
            ctx.ellipse(sx, sy, s.size * 1.5, s.size * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    renderAir(ctx, camera) {

        // 噴濺粒子
        for (const p of this.particles) {
            const { x: sx, y: sy } = IsoEngine.worldToScreen(p.x, p.y, p.z, camera);
            if (!IsoEngine.isVisible(sx, sy, 20, ctx.canvas.width, ctx.canvas.height)) continue;

            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // 浮動文字
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        for (const t of this.floatingTexts) {
            const { x: sx, y: sy } = IsoEngine.worldToScreen(t.x, t.y, t.z, camera);
            const alpha = t.life / t.maxLife;
            ctx.fillStyle = t.color;
            ctx.globalAlpha = alpha;
            ctx.fillText(t.text, sx, sy);
        }

        ctx.restore();
    }
}

    }

        this.dayLengthSec = DAY_NIGHT_CONFIG.DAY_LENGTH_SEC;
        this.hourSpeed = 24 / this.dayLengthSec; // 每秒推進的小時數

        this.hasWarnedNight = false;

        this.lastHour = this.currentHour;
    }

    /**
     * 更新時間推進與觸發晝夜事件
     * @param {number} dt 
     * @returns {{event: string|null, message: string|null, color: string|null, scoreBonus: number}}
     */
    update(dt) {
        let event = null;
        let message = null;
        let color = null;
        let scoreBonus = 0;

        this.lastHour = this.currentHour;
        this.currentHour += this.hourSpeed * dt;

        // 跨越 24 小時（新的一天）
        if (this.currentHour >= 24) {
            this.currentHour -= 24;
            this.currentDay++;
            this.hasWarnedDusk = false;
            this.hasWarnedNight = false;
            this.hasRewardedDawn = false;
        }

        if (this.currentHour >= DAY_NIGHT_CONFIG.DAWN_HOUR && this.currentHour < DAY_NIGHT_CONFIG.DAY_START_HOUR) {
            if (!this.hasRewardedDawn) {
                this.hasRewardedDawn = true;
                event = 'DAWN_REWARD';
                message = `🌄 黎明破曉！平安度過第 ${this.currentDay} 晚！生存評分 +${DAY_NIGHT_CONFIG.SURVIVE_NIGHT_BONUS_SCORE}`;
                color = '#fef08a';
                scoreBonus = DAY_NIGHT_CONFIG.SURVIVE_NIGHT_BONUS_SCORE;
            }
        }

        // 2. 黃昏警示事件 (18:00)
        if (this.currentHour >= DAY_NIGHT_CONFIG.DUSK_HOUR && this.currentHour < DAY_NIGHT_CONFIG.NIGHT_HOUR) {

            }

                message = '🌙 夜幕降臨！殭屍全面甦醒狂暴化，堅守防線抵禦夜襲！';

    isDawn() {

    }

    /**
     * 取得目前階段代表稱謂與圖標
     */
    getPeriodInfo() {
        if (this.isDay()) {
            return { name: '白天', icon: '☀️', statusText: '低威脅．安全搜刮物資', color: '#38bdf8' };
        }
        if (this.isDusk()) {
            return { name: '黃昏', icon: '🌅', statusText: '暮色降臨．速返掩體加固', color: '#f59e0b' };
        }
        if (this.isDawn()) {
            return { name: '黎明', icon: '🌄', statusText: '破曉朝陽．屍潮平息', color: '#34d399' };
        }
        return { name: '黑夜', icon: '🌙', statusText: '屍群狂暴．堅守防線至破曉', color: '#ef4444' };
    }

    /**
     * 取得格式化時間文字 (例如 "08:30", "14:05")
     */
    getFormattedTime() {
        const hour = Math.floor(this.currentHour);
        const minute = Math.floor((this.currentHour - hour) * 60);
        const hh = hour.toString().padStart(2, '0');
        const mm = minute.toString().padStart(2, '0');

    }

    /**
     * 計算環境黑暗遮罩 Alpha 數值 (0.0 = 全白晝, 0.86 = 漆黑深夜)

    getDarknessAlpha() {
        const h = this.currentHour;
        const maxDark = 0.86;

        // 06:00 ~ 17:30：白天，全無暗黑遮罩
        if (h >= 6.0 && h < 17.5) {
            return 0.0;
        }

        // 17:30 ~ 20:30：黃昏轉入黑夜 (平滑漸暗 0.0 -> 0.86)
        if (h >= 17.5 && h < 20.5) {
            const t = (h - 17.5) / 3.0;
            return maxDark * t;
        }

        // 20:30 ~ 04:30：深夜，維持最深黑暗度
        if (h >= 20.5 || h < 4.5) {
            return maxDark;
        }

        // 04:30 ~ 06:00：黎明轉入白天 (平滑漸亮 0.86 -> 0.0)
        if (h >= 4.5 && h < 6.0) {
            const t = (h - 4.5) / 1.5;
            return maxDark * (1.0 - t);
        }

        return 0.0;
    }

    /**
     * 取得當前環境濾鏡色調（黃昏微暖紅、黎明冷青）
     */
    getAmbientTint() {
        if (this.isDusk()) {
            return 'rgba(217, 119, 6, 0.16)'; // 溫暖夕陽橘紅
        }
        if (this.isDawn()) {
            return 'rgba(56, 189, 248, 0.12)'; // 晨霧微藍
        }
        return null;
    }

/**
 * js/ui/Notification.js
 * 浮動獲得物資提示與警告通知隊列
 */
class NotificationSystem {
    constructor() {
        this.notifications = [];
    }

    reset() {
        this.notifications = [];
    }

    /**
     * 新增一則提示通知
     * @param {string} text 
     * @param {string} [color='#38bdf8'] 
     * @param {number} [duration=2.5] 
     */
    add(text, color = '#38bdf8', duration = 2.5) {
        // 最多同時顯示 4 則
        if (this.notifications.length >= 4) {
            this.notifications.shift();
        }
        this.notifications.push({
            text,
            color,
            life: duration,
            maxLife: duration
        });
    }

    /**
     * 更新通知壽命
     * @param {number} dt 
     */
    update(dt) {
        for (let i = this.notifications.length - 1; i >= 0; i--) {
            this.notifications[i].life -= dt;
            if (this.notifications[i].life <= 0) {
                this.notifications.splice(i, 1);
            }
        }
    }

    /**
     * 繪製提示通知
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} canvasW 
     * @param {number} canvasH 
     */
    render(ctx, canvasW, canvasH) {
        if (this.notifications.length === 0) return;

        ctx.save();
        const startY = canvasH - 120;
        const spacing = 26;

        for (let i = 0; i < this.notifications.length; i++) {
            const notif = this.notifications[i];
            const y = startY - (this.notifications.length - 1 - i) * spacing;
            const alpha = Math.min(1, notif.life / 0.4);

            ctx.globalAlpha = alpha;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
            ctx.strokeStyle = notif.color;
            ctx.lineWidth = 1;

            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            const textMetrics = ctx.measureText(notif.text);
            const boxW = textMetrics.width + 24;

            ctx.beginPath();
            ctx.roundRect((canvasW - boxW) / 2, y - 16, boxW, 22, 4);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = notif.color;
            ctx.fillText(notif.text, canvasW / 2, y);
        }

        ctx.restore();
    }
}

        // 繪製第一排 9 個快捷槽位
        for (let i = 0; i < inventory.hotbarSlots; i++) {
            const sx = startX + i * (slotSize + gap);
            const isSelected = i === selectedIndex;
            const slot = inventory.hotbar[i];

            // 槽位背景
            ctx.fillStyle = isSelected ? 'rgba(30, 41, 59, 0.95)' : 'rgba(15, 23, 42, 0.85)';
            ctx.strokeStyle = isSelected ? '#38bdf8' : '#334155';
            ctx.lineWidth = isSelected ? 2.5 : 1;
            ctx.beginPath();
            ctx.roundRect(sx, startY, slotSize, slotSize, 6);
            ctx.fill();
            ctx.stroke();

            // 快捷數字鍵提示 [1~9]
            ctx.fillStyle = isSelected ? '#38bdf8' : '#64748b';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`[${i + 1}]`, sx + 4, startY + 12);

            // 繪製槽內物品或武器
            if (slot) {
                if (slot.type === 'weapon') {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    // 簡短名稱
                    const shortName = slot.weaponDef.id === 'fists' ? '空手' : (slot.weaponDef.id === 'pistol' ? '手槍' : slot.weaponDef.name);
                    ctx.fillText(shortName, sx + slotSize / 2, startY + slotSize / 2 + 5);

                    if (slot.weaponDef.type === 'ranged') {
                        ctx.fillStyle = '#38bdf8';
                        ctx.font = '9px monospace';
                        ctx.fillText(`${slot.loadedAmmo}`, sx + slotSize - 8, startY + slotSize - 4);
                    }
                } else if (slot.type === 'item') {
                    ctx.font = '18px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(slot.itemDef.icon, sx + slotSize / 2, startY + slotSize / 2 + 3);

                    // 堆疊數量
                    ctx.fillStyle = '#fef08a';
                    ctx.font = 'bold 10px monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText(`x${slot.count}`, sx + slotSize - 4, startY + slotSize - 4);
                }
            }
        }

        ctx.restore();
    }

    static renderMiniMap(ctx, game, W) {
        const size = 156, x0 = W - size - 16, y0 = 82, range = 18;
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.88)'; ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(x0 - 5, y0 - 5, size + 10, size + 28, 8); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.roundRect(x0, y0, size, size, 4); ctx.clip();
        const cell = size / (range * 2 + 1), startX = Math.floor(game.player.x) - range, startY = Math.floor(game.player.y) - range;
        for (let x = 0; x <= range * 2; x++) for (let y = 0; y <= range * 2; y++) {
            const wx = startX + x, wy = startY + y;
            if (!game.cityMap.isExplored(wx, wy, game.player.floorLevel || 0)) continue;
            ctx.fillStyle = this.getMapColor(game.cityMap.grid[wx]?.[wy]);
            ctx.fillRect(x0 + x * cell, y0 + y * cell, Math.ceil(cell), Math.ceil(cell));
        }
        ctx.fillStyle = '#f43f5e'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x0 + (game.player.x - startX + 0.5) * cell, y0 + (game.player.y - startY + 0.5) * cell, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
        ctx.fillStyle = '#cbd5e1'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('N  •  [M] 開啟已探索地圖', x0 + size / 2, y0 + size + 15);
    }

    static renderWorldMap(ctx, game, W, H) {
        ctx.save();
        ctx.fillStyle = 'rgba(2, 6, 23, 0.95)'; ctx.fillRect(0, 0, W, H);
        const marginX = 46, marginY = 54;
        const cell = Math.min((W - marginX * 2) / game.cityMap.cols, (H - marginY * 2) / game.cityMap.rows);
        const mapW = cell * game.cityMap.cols, mapH = cell * game.cityMap.rows;
        const x0 = (W - mapW) / 2, y0 = (H - mapH) / 2;
        ctx.fillStyle = '#0f172a'; ctx.fillRect(x0, y0, mapW, mapH);
        for (const key of game.cityMap.exploredTiles) {
            const [wx, wy, floor = 0] = key.split(',').map(Number);
            if (floor !== (game.player.floorLevel || 0)) continue;
            ctx.fillStyle = this.getMapColor(game.cityMap.grid[wx]?.[wy]);
            ctx.fillRect(x0 + wx * cell, y0 + wy * cell, Math.max(1, cell + 0.15), Math.max(1, cell + 0.15));
        }
        ctx.fillStyle = '#fb7185'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x0 + (game.player.x + 0.5) * cell, y0 + (game.player.y + 0.5) * cell, Math.max(4, cell * 2), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`已探索地圖｜${(game.player.floorLevel || 0) + 1} 樓　—　[M] 或 [ESC] 返回遊戲`, W / 2, Math.max(28, y0 - 18));
        ctx.restore();
    }

    static renderInventoryDialog(ctx, game, W, H) {
        const layout = this.getInventoryLayout(W, H);
        const { dx, dy, dw, dh, gap, slotSize, gridX, gridY } = layout;
        ctx.save();
        ctx.fillStyle = 'rgba(0, 0, 0, 0.72)'; ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.98)'; ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(dx, dy, dw, dh, 10); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('🎒 背包與合成工坊', dx + 22, dy + 30);
        ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.roundRect(dx + dw - 90, dy + 10, 72, 28, 5); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('關閉 (ESC)', dx + dw - 54, dy + 29);

        const categoryWidth = Math.min(96, (dw - 44 - 30) / CRAFTING_CATEGORIES.length), categoryGap = 5;
        CRAFTING_CATEGORIES.forEach((category, index) => {
            const x = dx + 22 + index * (categoryWidth + categoryGap), y = layout.categoriesY;
            const active = game.craftingCategory === category;
            ctx.fillStyle = active ? 'rgba(14, 165, 233, 0.35)' : 'rgba(30, 41, 59, 0.9)';
            ctx.strokeStyle = active ? '#38bdf8' : '#475569'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(x, y, categoryWidth, 28, 5); ctx.fill(); ctx.stroke();
            ctx.fillStyle = active ? '#e0f2fe' : '#94a3b8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText(category, x + categoryWidth / 2, y + 18);
        });
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('將配方所需材料放入研究台可解鎖；材料充足時按綠色按鈕合成。', dx + 22, dy + 78);

        const recipes = CRAFTING_RECIPES.filter(recipe => game.inventory.hasDiscoveredMaterials(recipe) &&
            (game.craftingCategory === '全部' || getCraftingCategory(recipe) === game.craftingCategory));
        const maxScroll = Math.max(0, Math.ceil(recipes.length / 2) - layout.recipeRows);
        game.craftingScroll = Math.min(game.craftingScroll || 0, maxScroll);
        const colW = layout.recipeColW, buttonW = 76;
        for (let row = 0; row < layout.recipeRows; row++) {
            for (let col = 0; col < 2; col++) {
                const index = game.craftingScroll * 2 + row * 2 + col;
                const recipe = recipes[index];
                if (!recipe) continue;
                const x = dx + 18 + col * (colW + 22), y = layout.recipesY + row * (layout.recipeCardH + layout.recipeGap);
                const unlocked = game.inventory.hasDiscoveredMaterials(recipe);
                const enough = recipe.materials.every(m => game.inventory.getItemCount(m.itemId) >= m.count);
                const feedback = game.craftFeedback?.recipeId === recipe.id && game.craftFeedback.timer > 0;
                const buttonColor = feedback ? (game.craftFeedback.success ? '#16a34a' : '#dc2626') :
                    (!unlocked ? '#475569' : (enough ? '#15803d' : '#b91c1c'));
                ctx.fillStyle = 'rgba(30, 41, 59, 0.95)'; ctx.strokeStyle = unlocked ? '#475569' : '#334155'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.roundRect(x, y, colW, layout.recipeCardH, 5); ctx.fill(); ctx.stroke();
                ctx.fillStyle = unlocked ? '#f8fafc' : '#94a3b8'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(`${unlocked ? '' : '🔒 '}${recipe.name}${recipe.reqWorkbench ? ' 🔧' : ''}`, x + 8, y + 15, colW - buttonW - 20);
                ctx.fillStyle = '#94a3b8'; ctx.font = '9px sans-serif';
                const materials = recipe.materials.map(m => `${ITEMS[m.itemId]?.name || m.itemId} ${game.inventory.getItemCount(m.itemId)}/${m.count}`).join('、');
                ctx.fillText(materials, x + 8, y + 33, colW - buttonW - 20);
                const pressOffset = feedback ? 2 : 0;
                ctx.fillStyle = buttonColor; ctx.strokeStyle = feedback ? '#f8fafc' : (enough && unlocked ? '#86efac' : '#fca5a5');
                ctx.beginPath(); ctx.roundRect(x + colW - buttonW - 6, y + 7 + pressOffset, buttonW, 31, 5); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(feedback ? (game.craftFeedback.success ? '✓ 完成' : '✕ 失敗') : (!unlocked ? '待研究' : (enough ? '合成' : '材料不足')), x + colW - buttonW / 2 - 6, y + 27 + pressOffset);
            }
        }
        if (maxScroll > 0) {
            ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right';
            ctx.fillText(`配方 ${game.craftingScroll + 1}/${maxScroll + 1}（滾輪瀏覽）`, dx + dw - 22, gridY - 8);
        }

        // 背包物品格固定顯示在合成清單下方，快捷欄仍是第一排。
        for (let index = 0; index < game.inventory.maxSlots; index++) {
            const row = Math.floor(index / 9), col = index % 9;
            const x = gridX + col * (slotSize + gap), y = gridY + row * (slotSize + gap);
            const item = game.inventory.getSlot(index);
            const selected = game.inventorySelectedSlot === index || (row === 0 && col === game.input.selectedHotbarIndex);
            ctx.fillStyle = row === 0 ? 'rgba(14, 116, 144, 0.34)' : 'rgba(30, 41, 59, 0.9)';
            ctx.strokeStyle = selected ? '#fef08a' : (row === 0 ? '#38bdf8' : '#475569'); ctx.lineWidth = selected ? 2.5 : 1;
            ctx.beginPath(); ctx.roundRect(x, y, slotSize, slotSize, 5); ctx.fill(); ctx.stroke();
            ctx.fillStyle = row === 0 ? '#7dd3fc' : '#64748b'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'left';
            ctx.fillText(row === 0 ? `[${col + 1}]` : `${index + 1}`, x + 4, y + 11);
            if (item) {
                ctx.fillStyle = '#f8fafc'; ctx.font = '21px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(item.itemDef?.icon || (item.type === 'weapon' ? '🔫' : '📦'), x + slotSize / 2, y + slotSize / 2 + 4);
                ctx.fillStyle = '#fef08a'; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'right';
                ctx.fillText(item.type === 'weapon' ? '武器' : `x${item.count}`, x + slotSize - 4, y + slotSize - 4);
            }
        }
        if (game.inventoryDragSource !== null && game.input.isAttackPressed()) {
            const dragged = game.inventory.getSlot(game.inventoryDragSource);
            if (dragged) {
                ctx.globalAlpha = 0.82; ctx.font = '28px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(dragged.itemDef?.icon || (dragged.type === 'weapon' ? '🔫' : '📦'), game.input.mousePos.x, game.input.mousePos.y);
                ctx.globalAlpha = 1;
            }
        }
        ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('第一排為快捷欄；拖曳格子可移動物品，右鍵背包格可放入目前快捷欄。', dx + 22, dy + dh - 8);
        ctx.restore();
    }

/**
 * js/core/GameLoop.js
 * 基於 requestAnimationFrame 之高精度 Delta Time 幀循環管理器
 */
class GameLoop {
    constructor(updateFn, renderFn) {
        this.updateFn = updateFn;
        this.renderFn = renderFn;
        this.lastTime = 0;
        this.isRunning = false;
        this.animationFrameId = null;

        this.loop = this.loop.bind(this);
    }

    start() {
        if (this.isRunning) return;
        this.isRunning = true;
        this.lastTime = performance.now();
        this.animationFrameId = requestAnimationFrame(this.loop);
    }

    stop() {
        this.isRunning = false;
        if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
        }
    }

    loop(currentTime) {
        if (!this.isRunning) return;

        // 計算真實 deltaTime (秒)，設定 0.1s 安全上限避免切換分頁時的時間跳躍
        const rawDelta = (currentTime - this.lastTime) / 1000;
        const dt = Math.min(rawDelta, 0.1);
        this.lastTime = currentTime;

        this.updateFn(dt, rawDelta);
        this.renderFn();

        this.animationFrameId = requestAnimationFrame(this.loop);
    }
}
