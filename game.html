            const building = this.cityMap.buildings.find(candidate => candidate.id === stair.buildingId);
            const name = building?.name || '高樓';
            consider(stair, 'landmark', `${name}樓梯間`, '走上樓梯即可前往其他樓層', 3, 30);
        }
        return best;
    }

    updatePowerSystem(dt) {
        const nodes = this.barricades.filter(structure => structure.isActive &&
            ['wind_generator', 'power_wire', 'battery'].includes(structure.type));
        const unvisited = new Set(nodes);
        this.powerComponents = [];

        while (unvisited.size) {
            const first = unvisited.values().next().value;
            unvisited.delete(first);
            const component = [first];
            for (let i = 0; i < component.length; i++) {
                const node = component[i];
                for (const candidate of [...unvisited]) {
                    if (Math.hypot(node.x - candidate.x, node.y - candidate.y) <= 1.5) {
                        unvisited.delete(candidate);
                        component.push(candidate);
                    }
                }
            }

            const hasGenerator = component.some(node => node.type === 'wind_generator');
            const batteries = component.filter(node => node.type === 'battery');
            if (hasGenerator) {
                for (const battery of batteries) battery.charge = Math.min(battery.capacity, battery.charge + dt * 1.5);
            } else {
                let drain = dt;
                for (const battery of batteries) {
                    const used = Math.min(battery.charge, drain);
                    battery.charge -= used;
                    drain -= used;
                    if (drain <= 0) break;
                }
            }
            const storedPower = batteries.reduce((sum, battery) => sum + battery.charge, 0);
            this.powerComponents.push({ nodes: component, powered: hasGenerator || storedPower > 0 });
        }
    }

    isGeneratorPowering(x, y) {
        return this.powerComponents.some(component => component.powered &&
            component.nodes.some(node => Math.hypot(node.x - x, node.y - y) <= 1.65));
    }

    craft(recipe) {
        if (!recipe || !this.inventory.hasDiscoveredMaterials(recipe)) {
            this.notifications.add('🔒 尚未研究此配方；請將所需材料放入研究台。', '#94a3b8', 2.0);
            return false;
        }
        if (!recipe || recipe.materials.some(m => this.inventory.getItemCount(m.itemId) < m.count)) {
            this.notifications.add('⚠️ 合成材料不足！', '#f59e0b', 2.0);
            return false;
        }
        const requiredStation = recipe.reqWorkbench === true ? 'workbench' : recipe.reqWorkbench;
        if (requiredStation && !this.barricades.some(b => b.isActive && b.type === requiredStation &&
            this.cityMap.isWithinPlacementRange(Math.round(b.x), Math.round(b.y), this.player.x, this.player.y))) {
            const stationName = requiredStation === 'metal_workbench' ? '金屬加工工作台' : '木工工作台';
            this.notifications.add(`⚠️ 需要靠近${stationName}才能製作！`, '#f59e0b', 2.0);
            return false;
        }
        const output = recipe.outputItem;
        if (output.isWeapon) {
            const slot = this.inventory.hotbar.findIndex(s => !s);
            if (slot < 0) {
                this.notifications.add('⚠️ 快捷欄已滿，請空出一格再製作武器。', '#f59e0b', 2.0);
                return false;
            }
            for (const material of recipe.materials) this.inventory.removeItem(material.itemId, material.count);
            const weapon = output.weaponKey === 'CROWBAR' ? WEAPONS.CROWBAR : WEAPONS.BASEBALL_BAT;
            this.inventory.hotbar[slot] = { type: 'weapon', id: weapon.id, weaponDef: weapon };
        } else {
            const item = ITEMS[output.itemId];
            if (!item || !this.inventory.canAddItem(item, output.count)) {
                this.notifications.add('⚠️ 背包空間不足，無法放入成品。', '#f59e0b', 2.0);
                return false;
            }
            for (const material of recipe.materials) this.inventory.removeItem(material.itemId, material.count);
            this.inventory.addItem(item, output.count);
            const placedInHotbar = this.inventory.preferredHotbarIndex !== null && this.inventory.preferredHotbarIndex !== undefined;
            if (placedInHotbar) this.selectNewPlaceable(item);
            else if (['seed', 'deployable'].includes(item.category)) {
                this.notifications.add(`🎒 快捷欄已滿，${item.name} 已放入背包。`, '#38bdf8', 2.2);
            }
        }
        this.notifications.add(`🛠️ 合成完成：${recipe.name}`, '#22c55e', 2.0);
        return true;
    }

    researchRecipesFromTable(table) {
        if (table?.type !== 'research_table' || !table.items) return;
        const materials = [...new Set(table.items.map(entry => entry.item?.id).filter(Boolean))];
        const unlocked = materials.flatMap(itemId => this.inventory.researchMaterial(itemId));
        if (unlocked.length) {
            this.notifications.add(`🧪 研究完成：已解鎖 ${unlocked.length} 種配方，研究材料已保留。`, '#22c55e', 3.0);
        }
    }

    selectNewPlaceable(itemDef) {
        if (!itemDef || !['seed', 'deployable'].includes(itemDef.category)) return;
        let index = this.inventory.preferredHotbarIndex;
        if (index === null || index === undefined) {
            const bagIndex = this.inventory.items.findIndex(slot => slot?.id === itemDef.id);
            if (bagIndex >= 0) {
                index = this.inventory.hotbar.findIndex(slot => !slot);
                if (index >= 0) this.inventory.moveSlot(this.inventory.hotbarSlots + bagIndex, index);
                else {
                    this.notifications.add(`🎒 快捷欄已滿，${itemDef.name} 留在背包。`, '#38bdf8', 2.2);
                    return;
                }
            }
        }
        if (index !== null && index !== undefined) {
            this.input.selectedHotbarIndex = index;
            this.notifications.add(`✅ ${itemDef.name} 已放入快捷欄 [${index + 1}]，右鍵即可使用。`, '#22c55e', 2.2);
        }
        this.inventory.preferredHotbarIndex = null;
    }

    moveBagItemToSelectedHotbar(mx, my) {
        const { gridX, gridY, gap, slotSize } = HUD.getInventoryLayout(this.canvas.width, this.canvas.height);
        const col = Math.floor((mx - gridX) / (slotSize + gap));
        const row = Math.floor((my - gridY) / (slotSize + gap));
        const withinCell = col >= 0 && col < 9 && row > 0 && row < 4 &&
            mx - (gridX + col * (slotSize + gap)) <= slotSize && my - (gridY + row * (slotSize + gap)) <= slotSize;
        if (!withinCell) return;
        const bagIndex = row * 9 + col;
        const item = this.inventory.getSlot(bagIndex);
        if (!item) return;
        const targetIndex = this.input.selectedHotbarIndex;
        this.inventory.moveSlot(bagIndex, targetIndex);
        this.inventorySelectedSlot = null;
        this.inventoryDragSource = null;
        this.notifications.add(`🎒 ${item.itemDef?.name || '物品'} 已移到快捷欄 [${targetIndex + 1}]。`, '#38bdf8', 2.0);
    }

    handleLootUIClick(mx, my) {
        if (!this.lootingContainer) return;

        const W = this.canvas.width;
        const H = this.canvas.height;
        const dw = Math.min(680, W - 40);
        const dh = Math.min(480, H - 40);
        const dx = (W - dw) / 2;
        const dy = (H - dh) / 2;

        // 1. 關閉按鈕 [✕ 關閉 (ESC)]
        const closeBtn = { x: dx + dw - 95, y: dy + 8, w: 80, h: 26 };
        if (mx >= closeBtn.x && mx <= closeBtn.x + closeBtn.w && my >= closeBtn.y && my <= closeBtn.y + closeBtn.h) {
            this.closeLootUI();
            return;
        }

        // 2. 全部拿取按鈕 [⚡ 全部拿取]
        const takeAllBtn = { x: dx + 20, y: dy + 48, w: 120, h: 28 };
        if (mx >= takeAllBtn.x && mx <= takeAllBtn.x + takeAllBtn.w && my >= takeAllBtn.y && my <= takeAllBtn.y + takeAllBtn.h) {
            if (this.lootingContainer.items && this.lootingContainer.items.length > 0) {
                const list = [...this.lootingContainer.items];
                let taken = 0;
                for (const entry of list) {
                    const added = this.inventory.canAddItem(entry.item, entry.count) && this.inventory.addItem(entry.item, entry.count);
                    if (added) {
                        taken++;
                        this.selectNewPlaceable(entry.item);
                        const idx = this.lootingContainer.items.indexOf(entry);
                        if (idx !== -1) this.lootingContainer.items.splice(idx, 1);
                    }
                }
                if (taken > 0) {
                    this.notifications.add('📦 已成功拿取物資放入背包！', '#22c55e', 2.0);
                } else {
                    this.notifications.add('⚠️ 背包已滿，無法拿取更多！', '#ef4444', 2.0);
                }
                if (this.lootingContainer.items.length === 0) {
                    this.lootingContainer.isLooted = !['storage_box', 'research_table'].includes(this.lootingContainer.type);
                    if (!['storage_box', 'research_table'].includes(this.lootingContainer.type)) this.closeLootUI();
                }
            }
            return;
        }

        const colW = (dw - 60) / 2;
        const startY = dy + 88;
        const itemH = 42;
        const visibleRows = Math.max(1, Math.floor((dh - 128) / (itemH + 6)));
        const carried = [
            ...this.inventory.hotbar.map((slot, index) => slot?.type === 'item' ? { ...slot, source: 'hotbar', index } : null).filter(Boolean),
            ...this.inventory.items.map((slot, index) => slot ? { ...slot, source: 'bag', index } : null).filter(Boolean)
        ];
        const scroll = Math.min(this.lootingScroll, Math.max(0, Math.max(this.lootingContainer.items?.length || 0, carried.length) - visibleRows));

        // 3. 點擊容器內個別物資 [拿取]
        const leftX = dx + 20;
        if (this.lootingContainer.items) {
            for (let i = scroll; i < Math.min(this.lootingContainer.items.length, scroll + visibleRows); i++) {
                const iy = startY + (i - scroll) * (itemH + 6);
                if (mx >= leftX && mx <= leftX + colW && my >= iy && my <= iy + itemH) {
                    const entry = this.lootingContainer.items[i];
                    if (entry) {
                        const added = this.inventory.canAddItem(entry.item, entry.count) && this.inventory.addItem(entry.item, entry.count);
                        if (added) {
                            this.selectNewPlaceable(entry.item);
                            this.notifications.add(`🎒 獲得：${entry.item.name} x${entry.count}`, '#38bdf8', 2.0);
                            this.lootingContainer.items.splice(i, 1);
                            if (this.lootingContainer.items.length === 0) {
                                this.lootingContainer.isLooted = !['storage_box', 'research_table'].includes(this.lootingContainer.type);
                            }
                        } else {
                            this.notifications.add('⚠️ 背包空間不足！', '#ef4444', 2.0);
                        }
                    }
                    return;
                }
            }
        }

        // 4. 點擊右側玩家背包物資 [放入容器]
        const rightX = dx + dw / 2 + 10;
        if (carried.length) {
            for (let i = scroll; i < Math.min(carried.length, scroll + visibleRows); i++) {
                const iy = startY + (i - scroll) * (itemH + 6);
                if (mx >= rightX && mx <= rightX + colW && my >= iy && my <= iy + itemH) {
                    const pItem = carried[i];
                    if (pItem) {
                        if (!this.lootingContainer.items) this.lootingContainer.items = [];
                        if (this.lootingContainer.maxStorageItems && this.lootingContainer.items.length >= this.lootingContainer.maxStorageItems) {
                            this.notifications.add(`⚠️ ${this.lootingContainer.name}已滿（${this.lootingContainer.maxStorageItems} 組物品）。`, '#ef4444', 2.0);
                            return;
                        }
                        this.lootingContainer.items.push({ item: pItem.itemDef, count: pItem.count });
                        this.lootingContainer.isLooted = false;
                        this.researchRecipesFromTable(this.lootingContainer);
                        if (pItem.source === 'hotbar') this.inventory.hotbar[pItem.index] = null;
                        else this.inventory.items[pItem.index] = null;
                        this.notifications.add(`📥 已將【${pItem.itemDef.name}】放入容器`, '#f59e0b', 2.0);
                    }
                    return;
                }
            }
        }

        // 點擊彈窗外部區域關閉
        if (mx < dx || mx > dx + dw || my < dy || my > dy + dh) {
            this.closeLootUI();
        }
    }

    update(dt, realDt = dt) {
        if (this.state === 'start') {
            if (this.input.isRestartTriggered() || this.input.isAttackTriggered()) {
                this.startNewGame();
            }
            this.input.endFrame();
            return;
        }

        if (this.state === 'gameover') {
            if (this.input.isRestartTriggered()) {
                this.startNewGame();
            }
            this.input.endFrame();
            return;
        }

        if (this.mapOpen) {
            if (this.input.isMapTriggered() || this.input.isCancelTriggered()) this.mapOpen = false;
            this.input.endFrame();
            return;
        }
        if (this.input.isMapTriggered()) {
            this.mapOpen = true;
            this.input.endFrame();
            return;
        }

        const wheelDelta = this.input.consumeHotbarWheel();
        if (wheelDelta && this.inventoryOpen) {
            const layout = HUD.getInventoryLayout(this.canvas.width, this.canvas.height);
            const recipes = CRAFTING_RECIPES.filter(recipe => this.inventory.hasDiscoveredMaterials(recipe) &&
                (this.craftingCategory === '全部' || getCraftingCategory(recipe) === this.craftingCategory));
            const maxScroll = Math.max(0, Math.ceil(recipes.length / 2) - layout.recipeRows);
            this.craftingScroll = Math.max(0, Math.min(maxScroll, (this.craftingScroll || 0) + Math.sign(wheelDelta)));
        } else if (wheelDelta && this.lootingContainer) {
            const bagItems = this.inventory.hotbar.filter(slot => slot?.type === 'item').length + this.inventory.items.filter(Boolean).length;
            const maxRows = Math.max(1, Math.floor((Math.min(480, this.canvas.height - 40) - 128) / 48));
            const maximum = Math.max(0, Math.max(this.lootingContainer.items?.length || 0, bagItems) - maxRows);
            this.lootingScroll = Math.max(0, Math.min(maximum, this.lootingScroll + Math.sign(wheelDelta)));
        } else if (wheelDelta) {
            this.input.selectedHotbarIndex = (this.input.selectedHotbarIndex + Math.sign(wheelDelta) + this.inventory.hotbarSlots) % this.inventory.hotbarSlots;
        }

        // --- 以下為 'playing' 進行中狀態 ---
        if (this.lootingContainer) {
            if (this.input.isCancelTriggered() || this.input.isInteractTriggered()) {
                this.closeLootUI();
            } else if (this.input.isAttackTriggered()) {
                this.handleLootUIClick(this.input.mousePos.x, this.input.mousePos.y);
            }
            this.input.endFrame();
            return;
        }
        if (this.inventoryOpen) {
            if (this.craftFeedback) {
                this.craftFeedback.timer -= realDt;
                if (this.craftFeedback.timer <= 0) this.craftFeedback = null;
            }
            if (this.input.isCancelTriggered() || this.input.isInteractTriggered()) {
                this.inventoryOpen = false;
                this.inventoryDragSource = null;
                this.inventorySelectedSlot = null;
            } else if (this.input.isAttackTriggered()) {
                const layout = HUD.getInventoryLayout(this.canvas.width, this.canvas.height);
                const { dx, dy, dw, dh, gridX, gridY, gap, slotSize } = layout;
                const mx = this.input.mouseDownPos.x, my = this.input.mouseDownPos.y;
                if (mx > dx + dw - 95 && my < dy + 42) {
                    this.inventoryOpen = false;
                    this.inventoryDragSource = null;
                } else if (my >= layout.categoriesY && my <= layout.categoriesY + 28 && mx >= dx + 22) {
                    const categoryWidth = Math.min(96, (dw - 44 - 30) / CRAFTING_CATEGORIES.length), categoryGap = 5;
                    const categoryIndex = Math.floor((mx - dx - 22) / (categoryWidth + categoryGap));
                    if (categoryIndex >= 0 && categoryIndex < CRAFTING_CATEGORIES.length) {
                        this.craftingCategory = CRAFTING_CATEGORIES[categoryIndex];
                        this.craftingScroll = 0;
                    }
                } else if (my >= layout.recipesY && my < gridY - 6) {
                    const row = Math.floor((my - layout.recipesY) / (layout.recipeCardH + layout.recipeGap));
                    const colW = layout.recipeColW;
                    const col = mx < dx + 18 + colW + 11 ? 0 : 1;
                    const cardX = dx + 18 + col * (colW + 22);
                    const insideCard = row >= 0 && row < layout.recipeRows && mx >= cardX && mx <= cardX + colW &&
                        my >= layout.recipesY + row * (layout.recipeCardH + layout.recipeGap) &&
                        my <= layout.recipesY + row * (layout.recipeCardH + layout.recipeGap) + layout.recipeCardH;
                    const recipes = CRAFTING_RECIPES.filter(recipe => this.inventory.hasDiscoveredMaterials(recipe) &&
                        (this.craftingCategory === '全部' || getCraftingCategory(recipe) === this.craftingCategory));
                    const recipe = recipes[(this.craftingScroll || 0) * 2 + row * 2 + col];
                    if (insideCard && recipe && mx >= cardX + colW - 84) {
                        const success = this.craft(recipe);
                        this.craftFeedback = { recipeId: recipe.id, success, timer: 0.32 };
                    }
                } else if (my >= gridY) {
                    const col = Math.floor((mx - gridX) / (slotSize + gap));
                    const row = Math.floor((my - gridY) / (slotSize + gap));
                    const withinCell = col >= 0 && col < 9 && row >= 0 && row < 4 &&
                        mx - (gridX + col * (slotSize + gap)) <= slotSize && my - (gridY + row * (slotSize + gap)) <= slotSize;
                    if (withinCell) {
                        const slotIndex = row * 9 + col;
                        if (row === 0) this.input.selectedHotbarIndex = col;
                        this.inventoryDragSource = this.inventory.getSlot(slotIndex) ? slotIndex : null;
                        this.inventorySelectedSlot = this.inventoryDragSource;
                    }
                }
            } else if (this.input.isRightClickTriggered()) {
                this.moveBagItemToSelectedHotbar(this.input.mousePos.x, this.input.mousePos.y);
            }
            if (this.inventoryDragSource !== null && this.input.mouseJustReleased) {
                const { gridX, gridY, gap, slotSize } = HUD.getInventoryLayout(this.canvas.width, this.canvas.height);
                const { x: mx, y: my } = this.input.mouseReleasePos;
                const col = Math.floor((mx - gridX) / (slotSize + gap));
                const row = Math.floor((my - gridY) / (slotSize + gap));
                const withinCell = col >= 0 && col < 9 && row >= 0 && row < 4 &&
                    mx - (gridX + col * (slotSize + gap)) <= slotSize && my - (gridY + row * (slotSize + gap)) <= slotSize;
                if (withinCell) {
                    const targetIndex = row * 9 + col;
                    this.inventory.moveSlot(this.inventoryDragSource, targetIndex);
                    if (row === 0) this.input.selectedHotbarIndex = col;
                }
                this.inventoryDragSource = null;
                this.inventorySelectedSlot = null;
            }
            this.input.endFrame();
            return;
        }
        this.gameTime += dt;

        this.cityMap.update(dt, this.player);
        if (this.cityMap.sandstormJustStarted) this.notifications.add('🌪️ 沙塵暴來襲！視線受阻，移動變慢，請尋找遮蔽。', '#fbbf24', 4.5);
        if (this.cityMap.sandstormJustEnded) this.notifications.add('🌤️ 沙塵暴已減弱，視線逐漸恢復。', '#fbbf24', 3.0);
        this.updatePowerSystem(dt);

        // 0. 更新日夜時鐘系統與晝夜交替事件
        const timeResult = this.timeSystem.update(dt);
        if (timeResult.message) {
            this.notifications.add(timeResult.message, timeResult.color || '#38bdf8', 4.5);
            if (timeResult.scoreBonus > 0) {
                this.score += timeResult.scoreBonus;
            }
        }

        // 1. 將滑鼠螢幕座標反算為 2.5D 世界座標，計算主角瞄準角度
        const mouseWorld = IsoEngine.screenToWorld(this.input.mousePos.x, this.input.mousePos.y, this.camera, this.player.z);
        this.aimWorld = mouseWorld;
        this.player.aimAngle = Math.atan2(mouseWorld.wy - this.player.y, mouseWorld.wx - this.player.x);

        this.aimTarget = this.getAimedTarget();
        const heldSlot = this.inventory.hotbar[this.input.selectedHotbarIndex];
        const isPlaceableHeld = heldSlot?.type === 'item' && ['seed', 'deployable'].includes(heldSlot.itemDef?.category);
        if (this.input.isRightClickTriggered() && !isPlaceableHeld && this.aimTarget?.kind === 'workbench') {
            const nearbyWorkbench = this.aimTarget.object;
            if (this.cityMap.isWithinPlacementRange(Math.round(nearbyWorkbench.x), Math.round(nearbyWorkbench.y), this.player.x, this.player.y)) {
                this.inventoryOpen = true;
                this.inventoryTab = 'crafting';
                this.craftingCategory = '全部';
                this.inventorySelectedSlot = null;
                this.notifications.add(`🛠️ 開啟${nearbyWorkbench.type === 'metal_workbench' ? '金屬加工台' : '木工工作台'}合成。`, '#38bdf8', 1.8);
            }
        }
        if (this.input.isRightClickTriggered() && this.aimTarget?.kind === 'container' &&
            ['storage_box', 'research_table'].includes(this.aimTarget.object.type) &&
            this.cityMap.isWithinPlacementRange(Math.round(this.aimTarget.object.x), Math.round(this.aimTarget.object.y), this.player.x, this.player.y)) {
            this.aimTarget.object.ensureLootGenerated();
            this.openLootUI(this.aimTarget.object);
        }

        // 2. 更新主角
        const interactionDt = Math.max(0, realDt);
        const playerMsg = this.player.update(
            dt, this.input, this.cityMap, this.inventory, this.bullets, this.barricades, this.particleSystem, this, interactionDt
        );
        this.cityMap.markExplored(this.player.x, this.player.y);
        if (playerMsg) {
            this.notifications.add(playerMsg, playerMsg.includes('❌') || playerMsg.includes('⚠️') ? '#f59e0b' : '#38bdf8', 2.2);
        }

        // 3. 檢查主角死亡
        if (this.player.health <= 0) {
            this.state = 'gameover';
            this.notifications.add('☠️ 你已被喪屍擊倒淪陷...', '#ef4444', 4.0);
            this.input.endFrame();
            return;
        }

        // 4. 更新子彈推進
        for (let i = this.bullets.length - 1; i >= 0; i--) {
            const b = this.bullets[i];
            const isAlive = b.update(dt, this.cityMap);
            if (!isAlive) {
                this.bullets.splice(i, 1);
            }
        }

        // 5. 更新喪屍集群、近戰與子彈碰撞（導入晝夜調控）
        const zmResult = this.zombieManager.update(
            dt, this.player, this.cityMap, this.bullets, this.barricades, this.particleSystem, this.timeSystem
        );

        if (zmResult.killed > 0) {
            this.kills += zmResult.killed;
            this.score += zmResult.score;
        }

        if (zmResult.hordeAlert === 'WARNING') {
            this.notifications.add('⚠️ 警報！探測到大量密集屍群正往街道集結！', '#ef4444', 4.0);
        } else if (zmResult.hordeAlert === 'HORDE_TRIGGER') {
            this.notifications.add('🚨 屍潮爆發！成群喪屍正在突襲！', '#b91c1c', 5.0);
        }

        // 6. 更新粒子與通知
        this.particleSystem.update(dt);
        this.notifications.update(dt);

        // 7. 清理已損壞防禦拒馬
        for (let i = this.barricades.length - 1; i >= 0; i--) {
            if (!this.barricades[i].isActive) {
                this.particleSystem.addFloatingText(this.barricades[i].x, this.barricades[i].y, '拒馬被毀！', '#f87171');
                this.barricades.splice(i, 1);
            }
        }

        // 8. 攝影機平滑跟隨主角 (平滑 Lerp)
        const targetScreen = IsoEngine.worldToScreen(this.player.x, this.player.y, this.player.z, { x: 0, y: 0 });
        const targetCamX = targetScreen.x - this.canvas.width / 2;
        const targetCamY = targetScreen.y - this.canvas.height / 2;
        this.camera.x += (targetCamX - this.camera.x) * 0.12;
        this.camera.y += (targetCamY - this.camera.y) * 0.12;
        this.cityMap.markVisibleExplored(this.camera, this.canvas.width, this.canvas.height,
            this.player.floorLevel || 0, this.cityMap.getPlayerFloorElevation(this.player));

        this.input.endFrame();
    }

    /**
     * 畫面繪製渲染管線
     */
    render() {
        const { width: W, height: H } = this.canvas;
        this.ctx.clearRect(0, 0, W, H);

        // 1. 底層深邃賽博末日原野底色
        this.ctx.fillStyle = '#090d16';
        this.ctx.fillRect(0, 0, W, H);

        // 2. 繪製 2.5D 可見地面瓦片（馬路、人行道、室內地磚）
        this.cityMap.renderGround(this.ctx, this.camera, this.player);

        // 3. 繪製地面殘留血跡
        this.particleSystem.renderGround(this.ctx, this.camera);

        // 4. 收集所有具有高度的 2.5D 實體並按 isoDepth 深度排序 (Y-Sorting)
        const renderables = [];

        // (A) 建築物牆體
        for (const w of this.cityMap.walls) {
            renderables.push({
                isoDepth: w.isoDepth,
                render: () => this.cityMap.renderWall(this.ctx, this.camera, w.x, w.y, w.height)
            });
        }

        for (const prop of this.cityMap.scenery) {
            const floorLevel = this.cityMap.getFloorLevelAt(prop.x, prop.y, this.player);
            const screen = IsoEngine.worldToScreen(prop.x, prop.y, floorLevel, this.camera);
            if (!IsoEngine.isVisible(screen.x, screen.y, 64, W, H)) continue;
            if (!this.cityMap.isVisibleToPlayer(prop.x, prop.y, this.player.x, this.player.y)) continue;
            renderables.push({
                isoDepth: prop.isoDepth,
                render: () => this.cityMap.renderScenery(this.ctx, this.camera, prop, floorLevel)
            });
        }

        // (B) 可搜刮容器
        for (const c of this.cityMap.containers) {
            const floorLevel = this.cityMap.getFloorLevelAt(c.x, c.y, this.player);
            const screen = IsoEngine.worldToScreen(c.x, c.y, floorLevel, this.camera);
            if (!IsoEngine.isVisible(screen.x, screen.y, 80, W, H)) continue;
            if (!this.cityMap.isVisibleToPlayer(c.x, c.y, this.player.x, this.player.y)) continue;
            const isNear = this.cityMap.isWithinPlacementRange(Math.round(c.x), Math.round(c.y), this.player.x, this.player.y);
            renderables.push({
                isoDepth: c.isoDepth,
                render: () => c.render(this.ctx, this.camera, isNear, floorLevel)
            });
        }

        // (C) 防禦拒馬
        for (const b of this.barricades) {
            const screen = IsoEngine.worldToScreen(b.x, b.y, 0, this.camera);
            if (!IsoEngine.isVisible(screen.x, screen.y, 70, W, H)) continue;
            if (b.isActive && this.cityMap.isVisibleToPlayer(b.x, b.y, this.player.x, this.player.y)) {
                renderables.push({
                    isoDepth: b.isoDepth,
                    render: () => b.render(this.ctx, this.camera)
                });
            }
        }

        // (D) 主角
        renderables.push({
            isoDepth: this.player.isoDepth,
            render: () => this.player.render(this.ctx, this.camera)
        });

        // (E) 喪屍群（傳入 isNight 渲染夜間眼部微光）
        const isNight = this.timeSystem.isNight();
        for (const z of this.zombieManager.zombies) {
            const screen = IsoEngine.worldToScreen(z.x, z.y, z.z, this.camera);
            if (!IsoEngine.isVisible(screen.x, screen.y, 64, W, H)) continue;
            if (z.isActive && this.cityMap.isVisibleToPlayer(z.x, z.y, this.player.x, this.player.y)) {
                renderables.push({
                    isoDepth: z.isoDepth,
                    render: () => z.render(this.ctx, this.camera, isNight)
                });
            }
        }

        // (F) 子彈
        for (const bullet of this.bullets) {
            if (bullet.isActive) {
                renderables.push({
                    isoDepth: bullet.isoDepth,
                    render: () => bullet.render(this.ctx, this.camera)
                });
            }
        }

        // 依照 2.5D 等角深度嚴格由遠及近排序繪製，確保完美的自然遮擋關係
        renderables.sort((a, b) => a.isoDepth - b.isoDepth);
        for (let i = 0; i < renderables.length; i++) {
            renderables[i].render();
        }

        // 屋頂最後繪製，確實遮住室內物件；玩家進屋後再淡出。
        for (const bld of this.cityMap.buildings) {
            this.cityMap.renderBuildingRoof(this.ctx, this.camera, bld);
        }

        this.renderPlacementPreview();

        // 5. 繪製空中粒子與浮動文字
        this.particleSystem.renderAir(this.ctx, this.camera);

        // 5.5 繪製晝夜環境光影遮罩與黑夜手電筒切光層 (Ambient Darkness & Flashlight Cutout)
        this.renderLightingPass(W, H);

        if (this.cityMap.isInColdZone(this.player.x, this.player.y)) this.renderSnowfall(W, H);
        if (this.cityMap.isInSandstorm(this.player.x, this.player.y)) this.renderSandstorm(W, H);

        // 6. 繪製浮動提示通知
        this.notifications.render(this.ctx, W, H);

        // 7. 繪製上方 HUD 狀態量表、快捷欄、日夜時鐘警報與覆蓋層
        HUD.render(this.ctx, this);
    }

    renderSnowfall(width, height) {
        const time = Date.now() / 1000;
        this.ctx.save();
        this.ctx.fillStyle = 'rgba(219, 234, 254, 0.68)';
        for (let i = 0; i < 75; i++) {
            const x = (i * 137 + time * (18 + (i % 7) * 3)) % width;
            const y = (i * 83 + time * (30 + (i % 5) * 4)) % height;
            this.ctx.globalAlpha = 0.35 + (i % 4) * 0.12;
            this.ctx.beginPath(); this.ctx.arc(x, y, i % 9 === 0 ? 2 : 1, 0, Math.PI * 2); this.ctx.fill();
        }
        this.ctx.restore();
    }

    renderSandstorm(width, height) {
        const playerScreen = IsoEngine.worldToScreen(this.player.x, this.player.y, 0, this.camera);
        const cx = playerScreen.x, cy = playerScreen.y;
        const gradient = this.ctx.createRadialGradient(cx, cy, 70, cx, cy, Math.max(width, height) * 0.8);
        gradient.addColorStop(0, 'rgba(217, 164, 91, 0.12)');
        gradient.addColorStop(0.4, 'rgba(217, 164, 91, 0.36)');
        gradient.addColorStop(1, 'rgba(180, 127, 58, 0.68)');
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(0, 0, width, height);
        const time = Date.now() / 1000;
        this.ctx.save();
        this.ctx.strokeStyle = 'rgba(255, 224, 171, 0.42)'; this.ctx.lineWidth = 1;
        for (let i = 0; i < 38; i++) {
            const x = (i * 97 + time * (80 + (i % 6) * 18)) % width;
            const y = (i * 59 + time * (25 + (i % 4) * 9)) % height;
            this.ctx.beginPath(); this.ctx.moveTo(x, y); this.ctx.lineTo(x + 12 + (i % 5) * 4, y - 2); this.ctx.stroke();
        }
        this.ctx.restore();
    }

    renderPlacementPreview() {
        const slot = this.inventory.hotbar[this.input.selectedHotbarIndex];
        const item = slot?.type === 'item' ? slot.itemDef : null;
        if (!item || !['seed', 'deployable'].includes(item.category) || !this.aimWorld) return;

        const x = Math.round(this.aimWorld.wx), y = Math.round(this.aimWorld.wy);
        if (x < 0 || x >= this.cityMap.cols || y < 0 || y >= this.cityMap.rows) return;
        const occupiedByContainer = this.cityMap.containers.some(c => Math.round(c.x) === x && Math.round(c.y) === y && (!c.isLooted || ['storage_box', 'research_table'].includes(c.type)));
        const occupiedByCrop = this.cityMap.growingCrops.some(c => Math.round(c.x) === x && Math.round(c.y) === y);
        const blockedByStructure = this.barricades.some(b => b.isActive && Math.round(b.x) === x && Math.round(b.y) === y);
        const tile = this.cityMap.grid[x][y];
        const inRange = this.cityMap.isWithinPlacementRange(x, y, this.player.x, this.player.y);
        const isValid = inRange && (item.category === 'seed'
            ? (tile === TILE_TYPES.WET_SOIL || tile === TILE_TYPES.FARMLAND_SOIL) && !occupiedByContainer && !occupiedByCrop
            : this.cityMap.isValidPlacementTile(x, y) && !blockedByStructure && !occupiedByContainer && !occupiedByCrop);

        const { x: sx, y: sy } = IsoEngine.worldToScreen(x, y, 0, this.camera);
        const halfW = ISO_CONFIG.TILE_WIDTH / 2, halfH = ISO_CONFIG.TILE_HEIGHT / 2;
        this.ctx.save();
        this.ctx.globalAlpha = 0.48;
        this.ctx.fillStyle = isValid ? '#22c55e' : '#ef4444';
        this.ctx.strokeStyle = isValid ? '#86efac' : '#fca5a5';
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        this.ctx.moveTo(sx, sy - halfH);
        this.ctx.lineTo(sx + halfW, sy);
        this.ctx.lineTo(sx, sy + halfH);
        this.ctx.lineTo(sx - halfW, sy);
        this.ctx.closePath();
        this.ctx.fill();
        this.ctx.stroke();
        this.ctx.restore();
    }

    /**
     * 繪製晝夜環境光影遮罩與黑夜手電筒動態破黑光錐
     * @param {number} W 
     * @param {number} H 
     */
    renderLightingPass(W, H) {
        const darkAlpha = this.timeSystem.getDarknessAlpha();
        const ambientTint = this.timeSystem.getAmbientTint();

        // 1. 若有黃昏暖橘或清晨薄藍，先套用柔和濾鏡
        if (ambientTint) {
            this.ctx.save();
            this.ctx.fillStyle = ambientTint;
            this.ctx.fillRect(0, 0, W, H);
            this.ctx.restore();
        }

        // 若無暗黑遮罩（純白天），直接返回
        if (darkAlpha <= 0.01) return;

        // 2. 建立/復用離屏光照緩衝畫布
        if (!this.lightingCanvas) {
            this.lightingCanvas = document.createElement('canvas');
            this.lightingCtx = this.lightingCanvas.getContext('2d');
        }
        if (this.lightingCanvas.width !== W || this.lightingCanvas.height !== H) {
            this.lightingCanvas.width = W;
            this.lightingCanvas.height = H;
        }

        const lctx = this.lightingCtx;
        lctx.clearRect(0, 0, W, H);

        // 填滿夜幕暗黑遮罩
        lctx.fillStyle = `rgba(3, 7, 18, ${darkAlpha})`;
        lctx.fillRect(0, 0, W, H);

        // 使用 destination-out 將光照區域從夜幕中挖穿透
        lctx.globalCompositeOperation = 'destination-out';

        const { x: psx, y: psy } = IsoEngine.worldToScreen(this.player.x, this.player.y, this.player.z, this.camera);

        // (A) 主角周圍環境微光環 (半徑 80px)
        const radGrad = lctx.createRadialGradient(psx, psy - 18, 12, psx, psy - 18, 80);
        radGrad.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
        radGrad.addColorStop(0.65, 'rgba(0, 0, 0, 0.7)');
        radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        lctx.fillStyle = radGrad;
        lctx.beginPath();
        lctx.arc(psx, psy - 18, 80, 0, Math.PI * 2);
        lctx.fill();

        // (B) 戰術手電筒長距離扇形強光錐 (隨主角 aimAngle 照射穿透黑暗)
        const beamAngle = this.player.aimAngle;
        const beamDist = 280;
        const coneAngle = 0.52;

        const leftWorldX = this.player.x + Math.cos(beamAngle - coneAngle) * 9.0;
        const leftWorldY = this.player.y + Math.sin(beamAngle - coneAngle) * 9.0;
        const rightWorldX = this.player.x + Math.cos(beamAngle + coneAngle) * 9.0;
        const rightWorldY = this.player.y + Math.sin(beamAngle + coneAngle) * 9.0;

        const leftScreen = IsoEngine.worldToScreen(leftWorldX, leftWorldY, 0, this.camera);
        const rightScreen = IsoEngine.worldToScreen(rightWorldX, rightWorldY, 0, this.camera);

        const coneGrad = lctx.createRadialGradient(psx, psy - 18, 20, psx, psy - 18, beamDist);
        coneGrad.addColorStop(0, 'rgba(0, 0, 0, 1.0)');
        coneGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0.85)');
        coneGrad.addColorStop(0.85, 'rgba(0, 0, 0, 0.4)');
        coneGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

        lctx.fillStyle = coneGrad;
        lctx.beginPath();
        lctx.moveTo(psx, psy - 18);
        lctx.lineTo(leftScreen.x, leftScreen.y);
        lctx.lineTo(rightScreen.x, rightScreen.y);
        lctx.closePath();
        lctx.fill();

        // 3. 繪製回主遊戲畫布
        this.ctx.save();
        this.ctx.drawImage(this.lightingCanvas, 0, 0);
        this.ctx.restore();
    }
}



// --- File: js\main.js ---
/**
 * js/main.js
 * 應用程式進入點，初始化 Game 並啟動 GameLoop 循環
 */


function startGame() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
        console.error('無法找到 #gameCanvas 元素');
        return;
    }

    const game = new Game(canvas);
    const loop = new GameLoop(
        (dt, realDt) => game.update(dt, realDt),
        () => game.render()
    );

    loop.start();

    const loading = document.getElementById('loadingOverlay');
    if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 450);
    }
}

if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', startGame);
} else {
    startGame();
}


})();
