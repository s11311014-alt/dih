* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #060911;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

#gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
}

/* 遊戲初始化載入中畫面 */
#loadingOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #0f172a 0%, #060911 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 999;
    transition: opacity 0.4s ease-out;
}

.spinner {
    width: 48px;
    height: 48px;
    border: 4px solid #1e293b;
    border-top: 4px solid #ef4444;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.loading-title {
    color: #ef4444;
    margin-top: 20px;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
    font-family: "Courier New", monospace;
}

.loading-sub {
    color: #94a3b8;
    font-size: 13px;
    margin-top: 10px;
}

/* 底部右下角作者浮水印標籤 */
.author-watermark {
    position: fixed;
    bottom: 8px;
    right: 14px;
    color: #38bdf8;
    font-size: 13px;
    font-weight: bold;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    z-index: 100;
}

/**
 * js/world/IsoEngine.js
 * 2.5D 等角透視轉換數學、座標對映與立體幾何繪製引擎
 */
class IsoEngine {
    /**
     * 世界連續座標 (wx, wy, wz) 轉換為螢幕像素座標 (sx, sy)
     * @param {number} wx 
     * @param {number} wy 
     * @param {number} [wz=0] 
     * @param {{x: number, y: number}} camera 
     * @returns {{x: number, y: number}}
     */
    static worldToScreen(wx, wy, wz = 0, camera = { x: 0, y: 0 }) {
        const halfW = ISO_CONFIG.TILE_WIDTH / 2;
        const halfH = ISO_CONFIG.TILE_HEIGHT / 2;
        const sx = (wx - wy) * halfW - camera.x;
        const sy = (wx + wy) * halfH - (wz * ISO_CONFIG.WALL_HEIGHT) - camera.y;
        return { x: sx, y: sy };
    }

    /**
     * 螢幕像素座標 (sx, sy) 逆向投影至世界地面座標 (wx, wy)
     * @param {number} sx 
     * @param {number} sy 
     * @param {{x: number, y: number}} camera 
     * @param {number} [wz=0] 
     * @returns {{wx: number, wy: number}}
     */
    static screenToWorld(sx, sy, camera = { x: 0, y: 0 }, wz = 0) {
        const halfW = ISO_CONFIG.TILE_WIDTH / 2;
        const halfH = ISO_CONFIG.TILE_HEIGHT / 2;
        const adjX = sx + camera.x;
        const adjY = sy + camera.y + (wz * ISO_CONFIG.WALL_HEIGHT);

        const wx = (adjX / halfW + adjY / halfH) / 2;
        const wy = (adjY / halfH - adjX / halfW) / 2;
        return { wx, wy };
    }

    /**
     * 取得 2.5D 深度鍵值（用於所有實體、牆壁、障礙物之 Y-Sorting 排序）
     * @param {number} wx 
     * @param {number} wy 
     * @param {number} [offset=0] 
     * @returns {number}
     */
    static getDepth(wx, wy, offset = 0) {
        return wx + wy + offset;
    }

    /**
     * 檢查螢幕座標是否處於可視範圍內（視錐剔除 Frustum Culling）
     * @param {number} sx 
     * @param {number} sy 
     * @param {number} margin 
     * @param {number} canvasW 
     * @param {number} canvasH 
     * @returns {boolean}
     */
    static isVisible(sx, sy, margin, canvasW, canvasH) {
        return sx >= -margin && sx <= canvasW + margin && sy >= -margin && sy <= canvasH + margin;
    }

    /**
     * 繪製地面 2.5D 等角菱形瓦片
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} sx 
     * @param {number} sy 
     * @param {string} fillColor 
     * @param {string|null} [strokeColor=null] 
     */
    static drawTile(ctx, sx, sy, fillColor, strokeColor = null) {
        const hw = ISO_CONFIG.TILE_WIDTH / 2;
        const hh = ISO_CONFIG.TILE_HEIGHT / 2;

        ctx.beginPath();
        ctx.moveTo(sx, sy - hh);
        ctx.lineTo(sx + hw, sy);
        ctx.lineTo(sx, sy + hh);
        ctx.lineTo(sx - hw, sy);
        ctx.closePath();

        ctx.fillStyle = fillColor;
        ctx.fill();

        if (strokeColor) {
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
    }

    /**
     * 繪製 2.5D 立體建築磚塊/牆面柱體 (頂面 + 左側面 + 右側面)
     * @param {CanvasRenderingContext2D} ctx 
     * @param {number} sx 
     * @param {number} sy 
     * @param {number} wallH 牆面拉伸高度
     * @param {string} topColor 
     * @param {string} leftColor 
     * @param {string} rightColor 
     */
    static drawIsoBlock(ctx, sx, sy, wallH, topColor, leftColor, rightColor) {
        const hw = ISO_CONFIG.TILE_WIDTH / 2;
        const hh = ISO_CONFIG.TILE_HEIGHT / 2;

        // 1. 左側垂直牆面
        ctx.beginPath();
        ctx.moveTo(sx - hw, sy);
        ctx.lineTo(sx, sy + hh);
        ctx.lineTo(sx, sy + hh - wallH);
        ctx.lineTo(sx - hw, sy - wallH);
        ctx.closePath();
        ctx.fillStyle = leftColor;
        ctx.fill();

        // 2. 右側垂直牆面
        ctx.beginPath();
        ctx.moveTo(sx, sy + hh);
        ctx.lineTo(sx + hw, sy);
        ctx.lineTo(sx + hw, sy - wallH);
        ctx.lineTo(sx, sy + hh - wallH);
        ctx.closePath();
        ctx.fillStyle = rightColor;
        ctx.fill();

        // 3. 頂部天花板水平菱形面
        ctx.beginPath();
        ctx.moveTo(sx, sy - hh - wallH);
        ctx.lineTo(sx + hw, sy - wallH);
        ctx.lineTo(sx, sy + hh - wallH);
        ctx.lineTo(sx - hw, sy - wallH);
        ctx.closePath();
        ctx.fillStyle = topColor;
        ctx.fill();
    }
}

        this.type = type;
        this.name = name;
        this.searchTime = searchTime;
        this.searchProgress = 0;
        this.isLooted = false;
        this.lootPool = lootPool; // 預設可能獲得的掉落表
        this.items = null;        // 搜刮開啟後的物品陣列 [{ item: itemDef, count }]
        this.maxStorageItems = ['storage_box', 'research_table'].includes(type) ? 24 : null;
        this.locked = locked;
        this.startsLocked = locked;
        this.unlockTime = unlockTime;

        this.radius = 0.55;
        this.isoDepth = IsoEngine.getDepth(this.x, this.y, 0.1);
    }

    /**
     * 重設容器狀態
     */
    reset() {
        this.searchProgress = 0;
        this.isLooted = false;
        this.items = null;
        this.locked = this.startsLocked;

     * 確保容器已產生掉落物

    ensureLootGenerated() {
        if (this.items === null) {
            this.items = this.generateLoot();
            if (this.items.length === 0 && !['storage_box', 'research_table'].includes(this.type)) {
                this.isLooted = true;
            }
        }
    }

     * 進行搜刮推進
     * @param {number} dt 
     * @returns {{completed: boolean, container: Container}|null}

    advanceSearch(dt) {
        if (this.isLooted) return null;

        // 若之前已經搜刮過但還有物品，直接完成
        if (this.searchProgress >= 1.0) {
            this.ensureLootGenerated();
            return { completed: true, container: this };

        this.searchProgress += dt / this.searchTime;
        if (this.searchProgress >= 1.0) {

    }

    translateLegacyWorld(offsetX, offsetY) {
        const shifted = Array.from({ length: this.cols }, () => Array(this.rows).fill(TILE_TYPES.GRASS_RUBBLE));
        for (let x = 1; x < this.cols - 1; x++) for (let y = 1; y < this.rows - 1; y++) {
            const nx = x + offsetX, ny = y + offsetY;
            if (nx < this.cols - 1 && ny < this.rows - 1) shifted[nx][ny] = this.grid[x][y];
        }
        this.grid = shifted;
        this.walls = this.walls.filter(w => w.x > 0 && w.x < this.cols - 1 && w.y > 0 && w.y < this.rows - 1);
        for (const wall of this.walls) {
            wall.x += offsetX; wall.y += offsetY; wall.isoDepth = IsoEngine.getDepth(wall.x, wall.y, 0.5);
        }
        for (const building of this.buildings) {
            building.x1 += offsetX; building.x2 += offsetX;
            building.y1 += offsetY; building.y2 += offsetY;
            for (const door of building.doors || []) { door.x += offsetX; door.y += offsetY; }
            building.isoDepth = IsoEngine.getDepth((building.x1 + building.x2) / 2, (building.y1 + building.y2) / 2, 1.2);
        }
        for (const prop of this.scenery) {
            prop.x += offsetX; prop.y += offsetY;
            if (Number.isFinite(prop.isoDepth)) prop.isoDepth += offsetX + offsetY;
        }
        this.fruitTreeTiles = this.fruitTreeTiles.map(tree => ({ ...tree, x: tree.x + offsetX, y: tree.y + offsetY }));
        this.stairwells = this.stairwells.map(stair => ({ ...stair, x: stair.x + offsetX, y: stair.y + offsetY }));
        this.snowPineTiles = new Set([...this.snowPineTiles].map(key => {
            const [x, y] = key.split(',').map(Number);
            return `${x + offsetX},${y + offsetY}`;
        }));
        this.scenery = this.scenery.filter(prop => prop.x > 0 && prop.x < this.cols - 1 && prop.y > 0 && prop.y < this.rows - 1);
        this.fruitTreeTiles = this.fruitTreeTiles.filter(tree => tree.x > 0 && tree.x < this.cols - 1 && tree.y > 0 && tree.y < this.rows - 1);
    }

    translateSpawnedContainers(offsetX, offsetY) {
        const sawmillSlots = new Map([
            ['c_sawmill_lumber_shelf', [376, 204]], ['c_sawmill_tool_shelf', [376, 214]],
            ['c_sawmill_supply_shelf', [367, 216]], ['c_sawmill_sawbench', [367, 205]],
            ['c_sawmill_drying_stock', [421, 204]], ['c_sawmill_repair_rack', [371, 247]],
            ['c_sawmill_bunkhouse_locker', [428, 238]], ['c_sawmill_machine_parts', [402, 248]]
        ]);
        const baseSlots = new Map([
            ['c_desert_armory_rack', [29, 352]], ['c_desert_armory_locker', [33, 356]],
            ['c_desert_barracks_locker', [63, 355]], ['c_desert_barracks_footlocker', [64, 360]],
            ['c_desert_mess_rations', [64, 383]], ['c_desert_mess_medkit', [64, 387]],
            ['c_desert_maintenance_parts', [29, 386]]
        ]);
        const farmSlots = new Map([
            ['c_crop_corn_1', [195, 351]], ['c_crop_corn_2', [200, 351]], ['c_crop_corn_3', [204, 351]],
            ['c_well_nw', [187, 347]], ['c_barn_nw', [202, 348]], ['c_crop_pump_1', [250, 430]],
            ['c_crop_pump_2', [255, 430]], ['c_crop_wheat_1', [260, 430]], ['c_well_sw', [253, 418]],
            ['c_orchard_box', [331, 363]], ['c_well_ne', [374, 431]], ['c_farm_tool_rack', [197, 348]]
        ]);
        const mineSlots = new Map([
            ['c_mine_tools', [254, 88]], ['c_mine_supply', [249, 110]],
            ['c_mine_barracks', [276, 88]], ['c_mine_stockpile', [255, 112]]
        ]);
        for (const container of this.containers) {
            if (container.id.startsWith('c_') || container.id.startsWith('ice_lake_fish_') ||
                container.id.startsWith('port_fishing_') || container.id.startsWith('port_cargo_')) {
                container.x += offsetX; container.y += offsetY;
            }
            const sawmill = sawmillSlots.get(container.id);
            const base = baseSlots.get(container.id);
            const mine = mineSlots.get(container.id);
            const farm = farmSlots.get(container.id);
            if (sawmill) [container.x, container.y] = sawmill;
            if (base) [container.x, container.y] = base;
            if (mine) [container.x, container.y] = mine;
            if (farm) [container.x, container.y] = farm;
            if (container.id === 'c_timber_box') [container.x, container.y] = [369, 149];
        }
    }

    generateRebuiltRegions() {
        this.terrainBlendColors.clear();
        // 丟棄舊地圖上互不相連的河道與海岸格，之後重畫唯一連通的水系。
        const legacyWater = new Set([TILE_TYPES.RIVER, TILE_TYPES.RIVER_BANK, TILE_TYPES.CANAL_BANK,
            TILE_TYPES.BRIDGE, TILE_TYPES.RIVER_BRIDGE, TILE_TYPES.OCEAN]);
        for (let x = 1; x < this.cols - 1; x++) for (let y = 1; y < this.rows - 1; y++) {
            if (legacyWater.has(this.grid[x][y])) this.grid[x][y] = TILE_TYPES.GRASS_RUBBLE;
        }
        const protectedTiles = new Set([
            TILE_TYPES.WALL, TILE_TYPES.DOORWAY, TILE_TYPES.ROAD, TILE_TYPES.SIDEWALK, TILE_TYPES.DIRT_PATH,
            TILE_TYPES.STAIRS, TILE_TYPES.STORE_FLOOR, TILE_TYPES.CLINIC_FLOOR, TILE_TYPES.POLICE_FLOOR,
            TILE_TYPES.WORKSHOP_FLOOR, TILE_TYPES.RESIDENTIAL_FLOOR, TILE_TYPES.MILITARY_FLOOR,
            TILE_TYPES.SUBURB_FLOOR, TILE_TYPES.SAND_CITY_FLOOR, TILE_TYPES.FARMLAND_SOIL, TILE_TYPES.WET_SOIL,
            TILE_TYPES.PLAZA_PAVER, TILE_TYPES.CITY_PARK, TILE_TYPES.CONCRETE
        ]);
        const inBuilding = (x, y) => this.buildings.some(b => x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2);
        const paint = (x, y, type) => {
            if (x < 1 || x >= this.cols - 1 || y < 1 || y >= this.rows - 1 || inBuilding(x, y)) return;
            const old = this.grid[x][y];
            if (protectedTiles.has(old) || [TILE_TYPES.RIVER, TILE_TYPES.RIVER_BANK, TILE_TYPES.CANAL_BANK,
                TILE_TYPES.BRIDGE, TILE_TYPES.RIVER_BRIDGE, TILE_TYPES.LAKE, TILE_TYPES.OCEAN].includes(old)) return;
            if ([TILE_TYPES.TREE, TILE_TYPES.ROCK].includes(old)) {
                this.scenery = this.scenery.filter(prop => prop.x !== x || prop.y !== y || !['tree', 'rock'].includes(prop.type));
                this.fruitTreeTiles = this.fruitTreeTiles.filter(tree => tree.x !== x || tree.y !== y);
                this.snowPineTiles.delete(`${x},${y}`);
            }
            this.grid[x][y] = type;
        };
        const mixColor = (a, b, amount) => {
            const t = Math.max(0, Math.min(1, amount));
            const channel = (hex, shift) => parseInt(hex.slice(1 + shift, 3 + shift), 16);
            const values = [0, 2, 4].map(shift => Math.round(channel(a, shift) * (1 - t) + channel(b, shift) * t));
            return `#${values.map(value => value.toString(16).padStart(2, '0')).join('')}`;
        };
        const smooth = (a, b, value) => {
            const t = Math.max(0, Math.min(1, (value - a) / (b - a)));
            return t * t * (3 - 2 * t);
        };
        const naturalTerrain = new Set([TILE_TYPES.FOREST_FLOOR, TILE_TYPES.GRASSLAND,
            TILE_TYPES.WASTELAND, TILE_TYPES.DESERT, TILE_TYPES.SNOW, TILE_TYPES.MOUNTAIN]);
        const clearDecor = (x1, x2, y1, y2) => {
            this.scenery = this.scenery.filter(prop => prop.x < x1 || prop.x > x2 || prop.y < y1 || prop.y > y2);
            this.fruitTreeTiles = this.fruitTreeTiles.filter(tree => tree.x < x1 || tree.x > x2 || tree.y < y1 || tree.y > y2);
        };

        // 清除舊座標上的鋸木廠聚落，稍後在東側針葉林重新建造。
        const oldSawmillNames = new Set(['廢棄鋸木廠', '伐木工宿舍', '木材乾燥倉', '鋸片維修棚', '伐木場宿舍', '林場機具庫', '伐木林場小木屋']);
        const oldSawmillBuildings = this.buildings.filter(b => oldSawmillNames.has(b.name));
        for (const b of oldSawmillBuildings) {
            for (let x = b.x1; x <= b.x2; x++) for (let y = b.y1; y <= b.y2; y++) this.grid[x][y] = TILE_TYPES.GRASS_RUBBLE;
            this.walls = this.walls.filter(w => w.x < b.x1 || w.x > b.x2 || w.y < b.y1 || w.y > b.y2);
        }
        const oldSawmillIds = new Set(oldSawmillBuildings.map(b => b.id));
        this.buildings = this.buildings.filter(b => !oldSawmillIds.has(b.id));
        clearDecor(185, 320, 360, 435);

        const oldMineBuildings = this.buildings.filter(b => ['北境煤礦坑口', '礦務工具間', '礦工宿舍', '煤礦物資庫'].includes(b.name));
        for (const b of oldMineBuildings) {
            for (let x = b.x1; x <= b.x2; x++) for (let y = b.y1; y <= b.y2; y++) this.grid[x][y] = TILE_TYPES.GRASS_RUBBLE;
            this.walls = this.walls.filter(w => w.x < b.x1 || w.x > b.x2 || w.y < b.y1 || w.y > b.y2);
        }
        const oldMineIds = new Set(oldMineBuildings.map(b => b.id));
        this.buildings = this.buildings.filter(b => !oldMineIds.has(b.id));
        this.scenery = this.scenery.filter(prop => !['mine_entrance', 'coal_vein'].includes(prop.type));

        const oldFarmNames = new Set(['老農莊農舍', '紅色穀倉', '風車農舍', '農具棚', '果園農莊', '草原小農舍', '河畔農舍']);
        const oldFarmBuildings = this.buildings.filter(b => oldFarmNames.has(b.name));
        for (const b of oldFarmBuildings) {
            for (let x = b.x1; x <= b.x2; x++) for (let y = b.y1; y <= b.y2; y++) this.grid[x][y] = TILE_TYPES.GRASS_RUBBLE;
            this.walls = this.walls.filter(w => w.x < b.x1 || w.x > b.x2 || w.y < b.y1 || w.y > b.y2);
        }
        const oldFarmIds = new Set(oldFarmBuildings.map(b => b.id));
        this.buildings = this.buildings.filter(b => !oldFarmIds.has(b.id));
        for (const [x1, x2, y1, y2] of [[104, 116, 231, 236], [104, 116, 321, 326], [194, 206, 322, 326],
            [124, 139, 346, 353], [153, 170, 348, 358]]) {
            for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) this.grid[x][y] = TILE_TYPES.GRASS_RUBBLE;
        }

        // 由北向南建出雪山、針葉林、闊葉林、中央平原、沙漠過渡帶與南方雨林。
        for (let x = 1; x < this.cols - 1; x++) {
            const ridge = 76 + Math.round(Math.sin(x / 19) * 12 + Math.sin(x / 7) * 4);
            for (let y = 1; y < 152; y++) {
                if (y <= ridge) paint(x, y, TILE_TYPES.MOUNTAIN);
                else if (y <= ridge + 48) paint(x, y, TILE_TYPES.SNOW);
                if ([TILE_TYPES.MOUNTAIN, TILE_TYPES.SNOW].includes(this.grid[x][y]) && Math.abs(y - ridge) <= 7) {
                    this.terrainBlendColors.set(`${x},${y}`, mixColor('#8f9fa6', '#d3e3f2', smooth(ridge - 7, ridge + 7, y)));
                }
            }
        }

        const placeForest = (x1, x2, y1, y2, species, density = 0.18) => {
            for (let x = x1; x <= x2; x++) for (let y = y1; y <= y2; y++) {
                const edge = Math.min(x - x1, x2 - x, y - y1, y2 - y);
                const noise = (Math.sin(x * 0.17 + y * 0.07) + Math.sin(y * 0.13 - x * 0.05) + 2) / 4;
                if (edge < 9 && noise > Math.max(0.15, edge / 11)) continue;
                paint(x, y, TILE_TYPES.FOREST_FLOOR);
                if (this.grid[x][y] === TILE_TYPES.FOREST_FLOOR && Math.random() < density) {
                    this.grid[x][y] = TILE_TYPES.TREE;
                    this.scenery.push({ type: 'tree', species, snowCovered: species === 'pine' && y < 155, x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
                    if (species === 'pine' && y < 155) this.snowPineTiles.add(`${x},${y}`);
                }
            }
        };
        placeForest(28, 498, 120, 270, 'pine', 0.2);
        placeForest(175, 430, 255, 332, 'broadleaf', 0.13);

        // 雪線以散落雪斑、覆雪針葉樹融入森林，闊葉林也逐步混入針葉林邊緣。
        for (let x = 28; x <= 498; x++) for (let y = 112; y <= 170; y++) {
            if (inBuilding(x, y)) continue;
            const blend = (Math.sin(x * 0.11 + y * 0.08) + Math.sin(y * 0.17 - x * 0.04) + 2) / 4;
            const tile = this.grid[x][y];
            if (tile === TILE_TYPES.FOREST_FLOOR && blend > 0.48) paint(x, y, TILE_TYPES.SNOW);
            else if (tile === TILE_TYPES.SNOW && blend > 0.72) paint(x, y, TILE_TYPES.FOREST_FLOOR);
            if (this.grid[x][y] === TILE_TYPES.TREE && y < 160) {
                this.snowPineTiles.add(`${x},${y}`);
                for (const prop of this.scenery) if (prop.x === x && prop.y === y && prop.type === 'tree') prop.snowCovered = true;
            } else if (this.grid[x][y] === TILE_TYPES.SNOW && blend < 0.26 && Math.random() < 0.13) {
                this.grid[x][y] = TILE_TYPES.TREE;
                this.snowPineTiles.add(`${x},${y}`);
                this.scenery.push({ type: 'tree', species: 'pine', snowCovered: true, x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
            }
            if ([TILE_TYPES.SNOW, TILE_TYPES.FOREST_FLOOR].includes(this.grid[x][y])) {
                this.terrainBlendColors.set(`${x},${y}`, mixColor('#c9dcf0', '#284b30', smooth(0.22, 0.8, blend)));
            }
        }
        for (let x = 175; x <= 430; x++) for (let y = 244; y <= 286; y++) {
            if (this.grid[x][y] !== TILE_TYPES.TREE) continue;
            const broadleafChance = Math.max(0, Math.min(1, (y - 244) / 42));
            for (const prop of this.scenery) {
                if (prop.x === x && prop.y === y && prop.type === 'tree' && Math.random() < broadleafChance) prop.species = 'broadleaf';
            }
        }

        // 沙地、荒原與草原以雜斑方式交疊，避免整齊的直線地形邊界。
        for (let x = 100; x <= 235; x++) for (let y = 390; y <= 500; y++) {
            if (inBuilding(x, y)) continue;
            const noise = (Math.sin(x * 0.13 + y * 0.09) + Math.sin(y * 0.16 - x * 0.05) + 2) / 4;
            const gradient = ((x - 100) / 135 + (y - 390) / 110) / 2 + (noise - 0.5) * 0.34;
            paint(x, y, gradient < 0.34 ? TILE_TYPES.DESERT : gradient < 0.69 ? TILE_TYPES.WASTELAND : TILE_TYPES.GRASSLAND);
        }
        for (let x = 155; x <= 450; x++) for (let y = 305; y <= 365; y++) {
            if (inBuilding(x, y)) continue;
            const noise = (Math.sin(x * 0.09 + y * 0.14) + Math.sin(y * 0.12 - x * 0.06) + 2) / 4;
            const forestEdge = 0.42 - ((y - 305) / 60) * 0.32 + (noise - 0.5) * 0.35;
            const tile = forestEdge > 0.42 ? TILE_TYPES.FOREST_FLOOR : TILE_TYPES.GRASSLAND;
            paint(x, y, tile);
            if (tile === TILE_TYPES.FOREST_FLOOR && this.grid[x][y] === TILE_TYPES.FOREST_FLOOR && Math.random() < 0.07) {
                this.grid[x][y] = TILE_TYPES.TREE;
                this.scenery.push({ type: 'tree', species: 'broadleaf', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
            }
        }
        // 草原漸變成南方雨林，樹木由稀疏逐步增加。
        for (let x = 1; x < this.cols - 1; x++) for (let y = 480; y <= 525; y++) {
            if (inBuilding(x, y)) continue;
            const noise = (Math.sin(x * 0.12 + y * 0.1) + Math.sin(y * 0.19 - x * 0.04) + 2) / 4;
            const forestWeight = Math.max(0, Math.min(1, (y - 486) / 34 + (noise - 0.5) * 0.45));
            const tile = forestWeight > 0.52 ? TILE_TYPES.FOREST_FLOOR : TILE_TYPES.GRASSLAND;
            paint(x, y, tile);
            if (tile === TILE_TYPES.FOREST_FLOOR && this.grid[x][y] === TILE_TYPES.FOREST_FLOOR && Math.random() < forestWeight * 0.2) {
                this.grid[x][y] = TILE_TYPES.TREE;
                this.scenery.push({ type: 'tree', species: 'broadleaf', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
            }
        }
        // 保留沙漠城鎮的沙地基底與城外緩衝沙丘。
        for (let x = 96; x <= 202; x++) for (let y = 438; y <= 516; y++) paint(x, y, TILE_TYPES.DESERT);

        // Reapply broad, noisy transition bands after the biome base pass above.
        // Low-frequency noise makes the joins rounded and patchy instead of straight.
        const terrainNoise = (x, y) => (Math.sin(x * 0.071 + y * 0.043) + Math.sin(y * 0.061 - x * 0.037) +
            Math.sin((x + y) * 0.029)) / 3;
        for (let x = 155; x <= 455; x++) for (let y = 300; y <= 382; y++) {
            if (inBuilding(x, y)) continue;
            const edge = 340 + 0.19 * (x - 180) + terrainNoise(x, y) * 24 + Math.sin(x / 19) * 5;
            const forestShare = Math.max(0, Math.min(1, (edge - y + 18) / 40));
            const patch = terrainNoise(x + 43, y - 12);
            const tile = forestShare > 0.64 + patch * 0.2 ? TILE_TYPES.FOREST_FLOOR
                : forestShare > 0.35 + patch * 0.15 ? TILE_TYPES.WASTELAND : TILE_TYPES.GRASSLAND;
            paint(x, y, tile);
            if (naturalTerrain.has(this.grid[x][y])) {
                const forestTint = smooth(0.18, 0.78, forestShare + patch * 0.05);
                const edgeTint = smooth(0.34, 0.68, forestShare + patch * 0.08);
                const grassToWaste = mixColor('#56883b', '#998457', edgeTint);
                this.terrainBlendColors.set(`${x},${y}`, mixColor(grassToWaste, '#284b30', forestTint));
            }
            if (tile === TILE_TYPES.FOREST_FLOOR && this.grid[x][y] === tile && Math.random() < 0.045) {
                this.grid[x][y] = TILE_TYPES.TREE;
                this.scenery.push({ type: 'tree', species: 'broadleaf', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
            }
        }
        for (let x = 84; x <= 254; x++) for (let y = 382; y <= 508; y++) {
            if (inBuilding(x, y)) continue;
            const desertEdge = 172 + 0.38 * (y - 430) + terrainNoise(x, y) * 26 + Math.sin(y / 14) * 8;
            const side = x - desertEdge;
            const patch = terrainNoise(x - 28, y + 19);
            const tile = side < -25 + patch * 12 ? TILE_TYPES.DESERT
                : side < 13 + patch * 16 ? TILE_TYPES.WASTELAND : TILE_TYPES.GRASSLAND;
            paint(x, y, tile);
            if (naturalTerrain.has(this.grid[x][y])) {
                const intoGrass = smooth(-28, 26, side + patch * 10);
                const fromSand = smooth(-62, -18, side + patch * 7);
                const sandToWaste = mixColor('#c3a265', '#938052', fromSand);
                this.terrainBlendColors.set(`${x},${y}`, mixColor(sandToWaste, '#54813a', intoGrass));
            }
        }
        for (let x = 1; x < this.cols - 1; x++) for (let y = 474; y <= 535; y++) {
            if (inBuilding(x, y)) continue;
            const rainforestEdge = 520 + Math.sin(x / 27) * 8 + terrainNoise(x, y) * 12;
            const dense = Math.max(0, Math.min(1, (y - rainforestEdge + 20) / 35));
            const tile = dense > 0.58 ? TILE_TYPES.FOREST_FLOOR : TILE_TYPES.GRASSLAND;
            paint(x, y, tile);
            if (naturalTerrain.has(this.grid[x][y])) {
                this.terrainBlendColors.set(`${x},${y}`, mixColor('#56883b', '#1f482d', smooth(0.08, 0.92, dense)));
            }
            if (tile === TILE_TYPES.FOREST_FLOOR && this.grid[x][y] === tile && Math.random() < dense * 0.16) {
                this.grid[x][y] = TILE_TYPES.TREE;
                this.scenery.push({ type: 'tree', species: 'broadleaf', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
            }
        }
        // Restore a rounded, broken-edged sandy basin around the desert settlement.
        for (let x = 94; x <= 204; x++) for (let y = 434; y <= 522; y++) {
            const shape = ((x - 150) / 56) ** 2 + ((y - 478) / 43) ** 2;
            if (shape < 1 + terrainNoise(x, y) * 0.08) {
                paint(x, y, TILE_TYPES.DESERT);
                this.terrainBlendColors.delete(`${x},${y}`);
            }
        }
        for (const [x, y] of [[103, 450], [115, 474], [145, 444], [183, 453], [196, 468],
            [103, 489], [120, 507], [151, 514], [177, 502], [194, 489], [89, 467], [205, 479]]) {
            if (inBuilding(x, y) || this.grid[x]?.[y] !== TILE_TYPES.DESERT) continue;
            this.scenery.push({ type: 'rubble', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.25) });
        }

        // 北方山地煤礦移入高山南麓，礦道只深入山壁，不開出穿越山脊的缺口。
        this.buildBuilding(225, 83, 239, 96, TILE_TYPES.WORKSHOP_FLOOR, [{ x: 232, y: 96 }], '北境煤礦坑口', '#475569');
        this.buildBuilding(247, 83, 261, 96, TILE_TYPES.WORKSHOP_FLOOR, [{ x: 254, y: 96 }], '礦務工具間', '#78350f');

                const [x1, y1] = points[segment], [x2, y2] = points[segment + 1];
                const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
                for (let step = 0; step <= steps; step++) {
                    const t = steps ? step / steps : 0;
                    const cx = Math.round(x1 + (x2 - x1) * t), cy = Math.round(y1 + (y2 - y1) * t);
                    for (let offset = -2; offset <= 2; offset++) {

    buildRoomIndex() {
        this.roomIndex = Array.from({ length: this.cols }, () => Array(this.rows).fill(null));
        for (const building of this.buildings) {
            let roomNumber = 0;
            for (let x = building.x1 + 1; x < building.x2; x++) {
                for (let y = building.y1 + 1; y < building.y2; y++) {
                    if ([TILE_TYPES.WALL, TILE_TYPES.DOORWAY].includes(this.grid[x][y]) || this.roomIndex[x][y]) continue;
                    const roomId = `${building.id}:${roomNumber++}`;
                    const queue = [[x, y]];
                    this.roomIndex[x][y] = roomId;
                    for (let head = 0; head < queue.length; head++) {
                        const [cx, cy] = queue[head];
                        for (const [nx, ny] of [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]]) {
                            if (nx <= building.x1 || nx >= building.x2 || ny <= building.y1 || ny >= building.y2) continue;
                            if ([TILE_TYPES.WALL, TILE_TYPES.DOORWAY].includes(this.grid[nx][ny]) || this.roomIndex[nx][ny]) continue;
                            this.roomIndex[nx][ny] = roomId;
                            queue.push([nx, ny]);
                        }
                    }
                }
            }
            for (let x = building.x1 + 1; x < building.x2; x++) {
                for (let y = building.y1 + 1; y < building.y2; y++) {
                    if (this.grid[x][y] !== TILE_TYPES.DOORWAY) continue;
                    const adjacentRoom = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]]
                        .map(([nx, ny]) => this.roomIndex[nx]?.[ny]).find(Boolean);
                    this.roomIndex[x][y] = adjacentRoom || null;
                }
            }
        }
    }

    getRoomId(wx, wy) {
        const x = Math.round(wx), y = Math.round(wy);
        return this.roomIndex?.[x]?.[y] || null;
    }

    isVisibleFromRoom(x, y, playerX, playerY) {
        const currentRoom = this.getRoomId(playerX, playerY);
        const targetRoom = this.getRoomId(x, y);
        return !currentRoom || !targetRoom || currentRoom === targetRoom;
    }

    hasLineOfSight(x0, y0, x1, y1) {
        const distance = Math.hypot(x1 - x0, y1 - y0);
        if (distance > 48) return true;
        const steps = Math.max(1, Math.ceil(distance * 3));
        for (let i = 1; i < steps; i++) {
            const t = i / steps;
            const x = Math.floor(x0 + (x1 - x0) * t);
            const y = Math.floor(y0 + (y1 - y0) * t);
            if (this.grid[x]?.[y] === TILE_TYPES.WALL) return false;
        }
        return true;
    }

    isVisibleToPlayer(x, y, playerX, playerY) {
        return this.isVisibleFromRoom(x, y, playerX, playerY) && this.hasLineOfSight(playerX, playerY, x, y);
    }

    generateWilderness() {
        const riverCenter = y => {
            if (y <= 70) return Math.round(158 - y * 0.55 + Math.sin(y / 13) * 2);
            if (y <= 100) return Math.round(119 - (y - 70) * 0.8 + Math.sin(y / 13));
            if (y <= 150) return 95 + Math.round(Math.sin(y / 24));
            if (y <= 205) return Math.round(95 - (y - 150) * 0.42 + Math.sin(y / 15) * 1.5);
            return 72 + Math.round(Math.sin(y / 30));
        };
        const eastRiverCenter = y => 220 + Math.round(Math.sin(y / 19) * 10);
        const paintRiver = (x, y, tileType) => {
            if (this.grid[x]?.[y] === undefined) return;
            const protectedTiles = [TILE_TYPES.WALL, TILE_TYPES.DOORWAY, TILE_TYPES.STORE_FLOOR,
                TILE_TYPES.CLINIC_FLOOR, TILE_TYPES.POLICE_FLOOR, TILE_TYPES.WORKSHOP_FLOOR,
                TILE_TYPES.RESIDENTIAL_FLOOR, TILE_TYPES.MILITARY_FLOOR, TILE_TYPES.SUBURB_FLOOR,
                TILE_TYPES.SAND_CITY_FLOOR];
            if (protectedTiles.includes(this.grid[x][y]) || this.buildings.some(b =>
                x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2)) return;
            const isUrbanCanal = y >= 100 && y <= 150 && tileType === TILE_TYPES.RIVER_BANK;
            this.grid[x][y] = isUrbanCanal ? TILE_TYPES.CANAL_BANK : tileType;
        };
        let randomSeed = (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;
        const random = () => {
            randomSeed = (randomSeed * 1664525 + 1013904223) >>> 0;
            return randomSeed / 4294967296;
        };
        this.fruitTreeTiles = [];
        this.snowPineTiles.clear();

        // 北境山脈與南方海岸擴展世界邊界，保留可通行山麓與港區陸地。
        for (let x = 4; x < this.cols - 4; x++) {
            for (let y = 4; y < this.rows - 4; y++) {
                const isCityOrLegacyFarm = x >= 18 && x <= 108 && y >= 18 && y <= 150;
                const ridgeLimit = 47 + Math.round(Math.sin(x / 16) * 9 + Math.sin(x / 7) * 2);
                if (!isCityOrLegacyFarm && y <= ridgeLimit && x >= 35 && x <= this.cols - 8 && this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) {
                    this.grid[x][y] = TILE_TYPES.MOUNTAIN;
                } else if (!isCityOrLegacyFarm && x >= 35 && x <= this.cols - 8 && y <= ridgeLimit + 48 && this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) {
                    this.grid[x][y] = TILE_TYPES.SNOW;
                }
                if (y >= 440 && this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) this.grid[x][y] = TILE_TYPES.OCEAN;
            }
        }

        for (let y = 6; y < this.rows - 5; y++) {
            const center = riverCenter(y);
            for (let offset = -2; offset <= 2; offset++) {
                const x = center + offset;
                paintRiver(x, y, Math.abs(offset) <= 1 ? TILE_TYPES.RIVER : TILE_TYPES.RIVER_BANK);
            }
        }

        // 東側河谷穿過闊葉林，與南方海灣相接。
        for (let y = 74; y < this.rows - 5; y++) {
            const center = eastRiverCenter(y);
            for (let offset = -2; offset <= 2; offset++) {
                const x = center + offset;
                paintRiver(x, y, Math.abs(offset) <= 1 ? TILE_TYPES.RIVER : TILE_TYPES.RIVER_BANK);
            }
        }
        for (let x = 0; x < this.cols; x++) {
            for (let y = 440; y < this.rows - 1; y++) {
                if (this.grid[x]?.[y] !== TILE_TYPES.WALL &&
                    ![TILE_TYPES.RIVER, TILE_TYPES.RIVER_BANK, TILE_TYPES.BRIDGE].includes(this.grid[x][y])) {
                    this.grid[x][y] = TILE_TYPES.OCEAN;
                }
            }
        }

        // 河上橋面採透水格，讓水面視覺上不會被道路切斷。
        for (const y of [41, 110, 140]) {
            const center = riverCenter(y);
            for (let offset = -2; offset <= 2; offset++) {
                this.grid[center + offset][y] = Math.abs(offset) <= 1 ? TILE_TYPES.RIVER_BRIDGE : TILE_TYPES.BRIDGE;
            }
        }

        for (let x = 4; x < this.cols - 4; x++) {
            for (let y = 4; y < this.rows - 4; y++) {
                const sawmillForest = x >= 140 && x <= 220 && y >= 142 && y <= 222;
                const broadNorthernPineForest = x >= 112 && x <= this.cols - 8 &&
                    y >= 44 + Math.round(Math.sin(x / 15) * 7) && y <= 177 + Math.round(Math.sin(x / 18) * 10);
                const northPineForest = (x >= 6 && x <= 112 && y >= 8 && y <= 20) ||
                    (x >= 6 && x <= 22 && y >= 21 && y <= 166) ||
                    (x >= 92 && x <= 128 && y >= 8 && y <= 112) ||
                    (x >= 108 && x <= 178 && y >= 82 && y <= 158) ||
                    (x >= 126 && x <= 188 && y >= 48 && y <= 118) || broadNorthernPineForest;
                const eastDeciduousForest = x >= 365 && x <= this.cols - 8 && y >= 96 && y <= 276;
                const prairie = (x >= 12 && x <= 94 && y >= 112 && y <= 228) ||
                    (x >= 120 && x <= 169 && y >= 82 && y <= 158);
                const desertWest = 4 + Math.round(Math.sin(y / 17) * 3);
                const desertEast = 178 + Math.round(Math.sin(y / 19) * 8 + Math.sin(y / 7) * 3);
                const desertNorth = 155 + Math.round(Math.sin(x / 13) * 6 + Math.sin(x / 29) * 4);
                const desert = x >= desertWest && x <= desertEast && y >= desertNorth && y <= 438;
                const wasteland = x >= 4 && x <= 192 + Math.round(Math.sin(y / 23) * 7) &&
                    y >= 138 + Math.round(Math.sin(x / 14) * 8) && y <= 438;
                if (this.grid[x][y] === TILE_TYPES.MOUNTAIN || this.grid[x][y] === TILE_TYPES.OCEAN ||
                    this.grid[x][y] === TILE_TYPES.RIVER || this.grid[x][y] === TILE_TYPES.RIVER_BANK || this.grid[x][y] === TILE_TYPES.CANAL_BANK ||
                    this.grid[x][y] === TILE_TYPES.LAKE) continue;
                if (this.grid[x][y] === TILE_TYPES.SNOW) {
                    if (northPineForest && random() < 0.085) {
                        this.grid[x][y] = TILE_TYPES.TREE;
                        this.snowPineTiles.add(`${x},${y}`);
                        this.scenery.push({ type: 'tree', species: 'pine', snowCovered: true, x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
                    }
                    continue;
                }
                if (desert && this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) {
                    const edgeDistance = Math.min(x - desertWest, desertEast - x, y - desertNorth, 318 - y);
                    const terrainNoise = (Math.sin(x * 0.19 + Math.sin(y * 0.08) * 2) + Math.sin(y * 0.16 + x * 0.035) + 2) / 4;
                    this.grid[x][y] = edgeDistance < 10 && terrainNoise > Math.max(0.08, edgeDistance / 12) ? TILE_TYPES.WASTELAND : TILE_TYPES.DESERT;
                    continue;
                }
                if (prairie) {
                    if (this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) this.grid[x][y] = TILE_TYPES.GRASSLAND;
                    continue;
                }
                if (wasteland && this.grid[x][y] === TILE_TYPES.GRASS_RUBBLE) {
                    this.grid[x][y] = TILE_TYPES.WASTELAND;
                    continue;
                }
                const nearEntrance = this.buildings.some(building => building.doors?.some(door =>
                    Math.abs(x - door.x) <= 3 && Math.abs(y - door.y) <= 3));
                const inGrove = northPineForest || eastDeciduousForest || sawmillForest;
                if (!inGrove || nearEntrance || this.grid[x][y] !== TILE_TYPES.GRASS_RUBBLE) continue;

                const adjacentTree = [[-1, 0], [0, -1], [-1, -1], [1, -1]].some(([dx, dy]) =>
                    this.grid[x + dx]?.[y + dy] === TILE_TYPES.TREE
                );
                const roll = random();
                const pineEdge = Math.min(x - 112, 276 - x,
                    y - (44 + Math.round(Math.sin(x / 15) * 7)), 187 + Math.round(Math.sin(x / 18) * 10) - y);
                const edgeDensity = broadNorthernPineForest ? Math.max(0.25, Math.min(1, pineEdge / 10)) : 1;
                if (broadNorthernPineForest && random() > edgeDensity) continue;
                const treeChance = (northPineForest || sawmillForest ? 0.19 : 0.12) * edgeDensity;
                if (!adjacentTree && roll < treeChance) {
                    this.grid[x][y] = TILE_TYPES.TREE;
                    this.scenery.push({ type: 'tree', species: northPineForest || sawmillForest ? 'pine' : 'broadleaf', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
                } else if (!adjacentTree && roll < treeChance + 0.035) {
                    this.grid[x][y] = TILE_TYPES.TREE;
                    this.fruitTreeTiles.push({ x, y });
                } else if (roll < treeChance + 0.05) {
                    this.grid[x][y] = TILE_TYPES.ROCK;
                    this.scenery.push({ type: 'rock', x, y, isoDepth: IsoEngine.getDepth(x, y, 0.35) });
                } else {
                    this.grid[x][y] = TILE_TYPES.FOREST_FLOOR;
                }
            }
        }

        // 北境東側冰湖：外圈保留岸邊，湖面可涉水並供捕魚。
        const lakeX = 240, lakeY = 26, radiusX = 12, radiusY = 9;
        for (let x = lakeX - radiusX - 1; x <= lakeX + radiusX + 1; x++) {
            for (let y = lakeY - radiusY - 1; y <= lakeY + radiusY + 1; y++) {
                const normalized = ((x - lakeX) / radiusX) ** 2 + ((y - lakeY) / radiusY) ** 2;
                if (normalized <= 1) this.grid[x][y] = TILE_TYPES.LAKE;
                else if (normalized <= 1.45) this.grid[x][y] = TILE_TYPES.RIVER_BANK;
                this.scenery = this.scenery.filter(prop => prop.x !== x || prop.y !== y);
            }
        }
    }

    /**
     * 建造外圍建築實體，並記錄至建築列表供屋頂遮蔽系統管理
     */
    buildBuilding(x1, y1, x2, y2, floorType, doors = [], name = '建築物', roofColor = '#475569', wallHeight = ISO_CONFIG.WALL_HEIGHT) {
        const minX = Math.min(x1, x2);
        const maxX = Math.max(x1, x2);
        const minY = Math.min(y1, y2);
        const maxY = Math.max(y1, y2);

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                this.grid[x][y] = floorType;
            }
        }

        for (let x = minX; x <= maxX; x++) {
            this.setWall(x, minY, wallHeight);
            this.setWall(x, maxY, wallHeight);
        }
        for (let y = minY; y <= maxY; y++) {
            this.setWall(minX, y, wallHeight);
            this.setWall(maxX, y, wallHeight);
        }

        doors.forEach(d => this.addDoor(d.x, d.y));

        // 記錄建築資訊與屋頂遮蔽透明度狀態
        this.buildings.push({
            id: `bld_${this.buildings.length + 1}`,
            name,
            x1: minX,
            y1: minY,
            x2: maxX,
            y2: maxY,
            floorType,
            roofColor,
            wallHeight,
            floorCount: wallHeight >= 90 ? Math.max(2, Math.round(wallHeight / 36)) : 1,
            doors: doors.map(door => ({ x: door.x, y: door.y })),
            roofAlpha: 1.0,     // 初始在戶外，屋頂完全遮蓋看不到內部
            targetAlpha: 1.0,
            isoDepth: IsoEngine.getDepth((minX + maxX) / 2, (minY + maxY) / 2, 1.2)
        });
    }

    addPartition(x1, y1, x2, y2, doorPos = null) {
        const startX = Math.min(x1, x2);
        const endX = Math.max(x1, x2);
        const startY = Math.min(y1, y2);
        const endY = Math.max(y1, y2);

        for (let x = startX; x <= endX; x++) {
            for (let y = startY; y <= endY; y++) {
                this.setWall(x, y);
            }
        }

        if (doorPos) {
            this.addDoor(doorPos.x, doorPos.y);
        }
    }

    addDoor(x, y) {
        const building = this.buildings.find(candidate => x >= candidate.x1 && x <= candidate.x2 && y >= candidate.y1 && y <= candidate.y2);
        if (building && !building.doors?.some(door => door.x === x && door.y === y)) {
            building.doors ||= [];
            building.doors.push({ x, y });
        }
        const openTile = (doorX, doorY) => {
            if (doorX < 0 || doorX >= this.cols || doorY < 0 || doorY >= this.rows) return;
            this.grid[doorX][doorY] = TILE_TYPES.DOORWAY;
            this.walls = this.walls.filter(w => !(w.x === doorX && w.y === doorY));
        };

        const horizontalPassage = [x - 1, x + 1].some(nx => nx >= 0 && nx < this.cols && this.grid[nx][y] !== TILE_TYPES.WALL);
        const verticalPassage = [y - 1, y + 1].some(ny => ny >= 0 && ny < this.rows && this.grid[x][ny] !== TILE_TYPES.WALL);
        openTile(x, y);

        // 玩家碰撞半徑約 0.38 格，兩格寬的門才能避免擦到相鄰牆角。
        const clearance = horizontalPassage && !verticalPassage
            ? [{ x, y: y + 1 }, { x, y: y - 1 }]
            : [{ x: x + 1, y }, { x: x - 1, y }];
        const extraOpening = clearance.find(tile => this.grid[tile.x]?.[tile.y] === TILE_TYPES.WALL);
        if (extraOpening) openTile(extraOpening.x, extraOpening.y);
    }

    setWall(x, y, height = ISO_CONFIG.WALL_HEIGHT) {
        this.grid[x][y] = TILE_TYPES.WALL;
        const existingWall = this.walls.find(w => w.x === x && w.y === y);
        if (existingWall) {
            existingWall.height = Math.max(existingWall.height || ISO_CONFIG.WALL_HEIGHT, height);
        } else {
            this.walls.push({
                x,
                y,
                height,
                isoDepth: IsoEngine.getDepth(x, y, 0.5)
            });
        }
    }

        const tryPlace = (type, groundTile, minX, maxX, minY, maxY, count) => {
            const candidates = [];
            for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) {
                if (this.grid[x]?.[y] !== groundTile) continue;
                if (this.containers.some(c => Math.hypot(c.x - x, c.y - y) < 1.8)) continue;
                if (this.scenery.some(p => Math.hypot(p.x - x, p.y - y) < 2.2)) continue;
                if (Math.hypot(x - 155, y - 278) < 5) continue;
                candidates.push({ x, y });
            }
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            for (const { x, y } of candidates.slice(0, count)) {
                this.scenery.push({ type, x, y, groundTile, isoDepth: IsoEngine.getDepth(x, y, 0.8) });
                this.grid[x][y] = type === 'car_wreck' ? TILE_TYPES.CAR_WRECK : TILE_TYPES.INDUSTRIAL_MACHINE;
            }
        };
        tryPlace('car_wreck', TILE_TYPES.ROAD, 112, 215, 232, 318, 7);
        tryPlace('industrial_machine', TILE_TYPES.WORKSHOP_FLOOR, 173, 186, 267, 283, 5);
        tryPlace('generator_wreck', TILE_TYPES.WORKSHOP_FLOOR, 173, 186, 267, 283, 2);

        // Small abandoned desert camps: ash rings, collapsed tents, wrecks, and scattered supplies.
        const camps = [
            { x: 108, y: 320, id: 'camp_north' }, { x: 107, y: 367, id: 'camp_mid' },
            { x: 108, y: 418, id: 'camp_south' }, { x: 148, y: 397, id: 'camp_east' }
        ];
        for (const camp of camps) {
            for (let x = camp.x - 5; x <= camp.x + 12; x++) for (let y = camp.y - 5; y <= camp.y + 7; y++) {
                const tile = this.grid[x]?.[y];
                if (tile === undefined || [TILE_TYPES.WALL, TILE_TYPES.DOORWAY, TILE_TYPES.RIVER,
                    TILE_TYPES.RIVER_BANK, TILE_TYPES.CANAL_BANK, TILE_TYPES.OCEAN, TILE_TYPES.LAKE].includes(tile) ||
                    this.buildings.some(b => x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2)) continue;
                this.grid[x][y] = TILE_TYPES.DESERT;
                this.terrainBlendColors.delete(`${x},${y}`);
            }
            this.scenery.push({ type: 'cold_campfire', x: camp.x, y: camp.y, isoDepth: IsoEngine.getDepth(camp.x, camp.y, 0.25) });
            this.scenery.push({ type: 'camp_tent', x: camp.x - 4, y: camp.y - 2, isoDepth: IsoEngine.getDepth(camp.x - 4, camp.y - 2, 0.6) });
            const wreckX = camp.x + 9, wreckY = camp.y + 3;
            if (![TILE_TYPES.WALL, TILE_TYPES.DOORWAY].includes(this.grid[wreckX]?.[wreckY]) &&
                !this.buildings.some(b => wreckX >= b.x1 && wreckX <= b.x2 && wreckY >= b.y1 && wreckY <= b.y2)) {
                this.grid[wreckX][wreckY] = TILE_TYPES.CAR_WRECK;
                this.scenery.push({ type: 'car_wreck', x: wreckX, y: wreckY, groundTile: TILE_TYPES.DESERT,
                    isoDepth: IsoEngine.getDepth(wreckX, wreckY, 0.8) });
            }
            this.containers.push(new Container({
                id: `${camp.id}_bag`, x: camp.x - 2, y: camp.y + 4, type: 'ground_loot', name: '遺留的補給袋', searchTime: 0.7,
                lootPool: [{ itemId: 'canned_food', minCount: 1, maxCount: 3, chance: 0.9 },
                    { itemId: 'water_bottle', minCount: 1, maxCount: 2, chance: 0.85 },
                    { itemId: 'bandage', minCount: 1, maxCount: 2, chance: 0.45 }]
            }));
            this.containers.push(new Container({
                id: `${camp.id}_crate`, x: camp.x + 3, y: camp.y - 3, type: 'ground_loot', name: '散落的營地物資', searchTime: 0.7,
                lootPool: [{ itemId: 'scrap_metal', minCount: 1, maxCount: 4, chance: 0.7 },
                    { itemId: 'wood_plank', minCount: 1, maxCount: 3, chance: 0.75 },
                    { itemId: 'bandage', minCount: 1, maxCount: 1, chance: 0.3 }]
            }));
        }
    }

    isWalkable(wx, wy, radius = 0.35) {
        const minX = Math.floor(wx - radius);
        const maxX = Math.floor(wx + radius);
        const minY = Math.floor(wy - radius);
        const maxY = Math.floor(wy + radius);

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                if (x < 0 || x >= this.cols || y < 0 || y >= this.rows) {
                    return false;
                }
                if (this.grid[x][y] === TILE_TYPES.TREE) {
                    const dx = wx - (x + 0.5), dy = wy - (y + 0.5);
                    if (dx * dx + dy * dy < (radius + TREE_COLLISION_RADIUS) ** 2) return false;
                    continue;
                }
                if (this.isBlockedTile(this.grid[x][y])) {
                    const closestX = Math.max(x, Math.min(wx, x + 1));
                    const closestY = Math.max(y, Math.min(wy, y + 1));
                    if ((wx - closestX) ** 2 + (wy - closestY) ** 2 < radius ** 2) return false;
                }
            }
        }
        return true;
    }

    isWithinPlacementRange(tileX, tileY, playerX, playerY, radius = 2) {
        return Math.abs(tileX - Math.round(playerX)) <= radius && Math.abs(tileY - Math.round(playerY)) <= radius;
    }

    isValidPlacementTile(x, y) {
        if (!Number.isInteger(x) || !Number.isInteger(y) || x < 1 || x >= this.cols - 1 || y < 1 || y >= this.rows - 1) return false;
        const tile = this.grid[x]?.[y];
        return tile !== undefined && !this.isBlockedTile(tile) && tile !== TILE_TYPES.RIVER && tile !== TILE_TYPES.LAKE && tile !== TILE_TYPES.OCEAN;
    }

    isBlockedTile(tileType) {
        return tileType === TILE_TYPES.WALL || tileType === TILE_TYPES.TREE || tileType === TILE_TYPES.ROCK ||
            tileType === TILE_TYPES.CAR_WRECK || tileType === TILE_TYPES.INDUSTRIAL_MACHINE || tileType === TILE_TYPES.MOUNTAIN;
    }

    isOnRiver(wx, wy, radius = 0.25) {
        const minX = Math.floor(wx - radius), maxX = Math.floor(wx + radius);
        const minY = Math.floor(wy - radius), maxY = Math.floor(wy + radius);
        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                if ([TILE_TYPES.RIVER, TILE_TYPES.LAKE, TILE_TYPES.OCEAN].includes(this.grid[x]?.[y])) return true;
            }
        }
        return false;
    }

    isProjectileBlocked(wx, wy) {
        const x = Math.floor(wx), y = Math.floor(wy);
        return x < 0 || x >= this.cols || y < 0 || y >= this.rows || this.isBlockedTile(this.grid[x][y]);
    }

    /**
     * 繪製 2.5D 可見地面瓦片（螢幕視錐動態裁剪）
     */
    renderGround(ctx, camera, player = null) {
        const canvasW = ctx.canvas.width;
        const canvasH = ctx.canvas.height;

        const viewZ = player?.z || 0;
        const c1 = IsoEngine.screenToWorld(0, 0, camera, viewZ);
        const c2 = IsoEngine.screenToWorld(canvasW, 0, camera, viewZ);
        const c3 = IsoEngine.screenToWorld(0, canvasH, camera, viewZ);
        const c4 = IsoEngine.screenToWorld(canvasW, canvasH, camera, viewZ);

        const minX = Math.max(0, Math.floor(Math.min(c1.wx, c2.wx, c3.wx, c4.wx)) - 2);
        const maxX = Math.min(this.cols - 1, Math.ceil(Math.max(c1.wx, c2.wx, c3.wx, c4.wx)) + 2);
        const minY = Math.max(0, Math.floor(Math.min(c1.wy, c2.wy, c3.wy, c4.wy)) - 2);
        const maxY = Math.min(this.rows - 1, Math.ceil(Math.max(c1.wy, c2.wy, c3.wy, c4.wy)) + 2);

        for (let x = minX; x <= maxX; x++) {
            for (let y = minY; y <= maxY; y++) {
                const tileType = this.grid[x][y];
                if (tileType === TILE_TYPES.WALL) continue;
                if (player && !this.isVisibleFromRoom(x, y, player.x, player.y) && this.roomIndex[x][y]) continue;

                const floorZ = this.getFloorLevelAt(x, y, player);
                const { x: sx, y: sy } = IsoEngine.worldToScreen(x, y, floorZ, camera);

                if (!IsoEngine.isVisible(sx, sy, 64, canvasW, canvasH)) {
                    continue;
                }

                let fillColor = '#1c1917';
                let strokeColor = 'rgba(0, 0, 0, 0.2)';

                switch (tileType) {
                    case TILE_TYPES.ROAD:
                        fillColor = ((x + y) % 2 === 0) ? '#18181b' : '#27272a';
                        break;
                    case TILE_TYPES.SIDEWALK:
                        fillColor = '#3f3f46';
                        strokeColor = '#52525b';
                        break;
                    case TILE_TYPES.SUBURB_LAWN:
                        fillColor = ((x + y) % 2 === 0) ? '#2e5b27' : '#35682d';
                        strokeColor = 'rgba(0, 0, 0, 0.15)';
                        break;
                    case TILE_TYPES.SUBURB_FLOOR:
                        fillColor = '#a16207';
                        break;
                    case TILE_TYPES.CITY_PARK:
                        fillColor = ((x + y) % 2 === 0) ? '#397443' : '#43804c';
                        strokeColor = '#285933';
                        break;
                    case TILE_TYPES.STAIRS:
                        fillColor = '#92400e';
                        strokeColor = '#fbbf24';
                        break;
                    case TILE_TYPES.FARMLAND_SOIL:
                        fillColor = ((x + y) % 2 === 0) ? '#3b2614' : '#2f1e10';
                        strokeColor = '#24160a';
                        break;
                    case TILE_TYPES.WET_SOIL:
                        fillColor = ((x + y) % 2 === 0) ? '#254b50' : '#1e4147';
                        strokeColor = '#16343a';
                        break;
                    case TILE_TYPES.FOREST_FLOOR:
                        fillColor = ((x + y) % 2 === 0) ? '#23452b' : '#1d3a25';
                        strokeColor = '#142b1b';
                        break;
                    case TILE_TYPES.GRASSLAND:
                        fillColor = ((x + y) % 2 === 0) ? '#4b7d35' : '#56883b';
                        strokeColor = '#365c2a';
                        break;
                    case TILE_TYPES.MOUNTAIN:
                        fillColor = ((x + y) % 2 === 0) ? '#899ba3' : '#a7b6bd';
                        strokeColor = '#647780';
                        break;
                    case TILE_TYPES.SNOW:
                        fillColor = ((x + y) % 2 === 0) ? '#dbeafe' : '#bfdbfe';
                        strokeColor = '#93c5fd';
                        break;
                    case TILE_TYPES.DESERT:
                        fillColor = ((x + y) % 2 === 0) ? '#b89556' : '#c8a767';
                        strokeColor = '#8e7140';
                        break;
                    case TILE_TYPES.WASTELAND:
                        fillColor = ((x + y) % 2 === 0) ? '#8b7750' : '#998457';
                        strokeColor = '#6b5c3e';
                        break;
                    case TILE_TYPES.SAND_CITY_FLOOR:
                        fillColor = ((x + y) % 2 === 0) ? '#b89556' : '#c8a767';
                        strokeColor = '#8e7140';
                        break;
                    case TILE_TYPES.RIVER:
                    case TILE_TYPES.LAKE:
                    case TILE_TYPES.OCEAN:
                        fillColor = ((x + y) % 2 === 0) ? '#075985' : '#0c4a6e';
                        strokeColor = '#38bdf8';
                        break;
                    case TILE_TYPES.RIVER_BRIDGE:
                        fillColor = ((x + y) % 2 === 0) ? '#075985' : '#0c4a6e';
                        strokeColor = '#38bdf8';
                        break;
                    case TILE_TYPES.RIVER_BANK:
                        fillColor = '#8b7355';
                        strokeColor = '#6b573f';
                        break;
                    case TILE_TYPES.CANAL_BANK:
                        fillColor = ((x + y) % 2 === 0) ? '#64748b' : '#718096';
                        strokeColor = '#475569';
                        break;
                    case TILE_TYPES.BRIDGE:
                        fillColor = ((x + y) % 2 === 0) ? '#a16207' : '#854d0e';
                        strokeColor = '#713f12';
                        break;
                    case TILE_TYPES.TREE:
                    case TILE_TYPES.ROCK:
                    case TILE_TYPES.CAR_WRECK:
                    case TILE_TYPES.INDUSTRIAL_MACHINE:
                        fillColor = '#23452b';
                        strokeColor = '#142b1b';
                        break;
                    case TILE_TYPES.DIRT_PATH:
                        fillColor = ((x + y) % 2 === 0) ? '#574129' : '#4d3822';
                        strokeColor = '#3d2b19';
                        break;
                    case TILE_TYPES.STORE_FLOOR:
                        fillColor = '#0284c7';
                        break;
                    case TILE_TYPES.CLINIC_FLOOR:
                        fillColor = '#0d9488';
                        break;
                    case TILE_TYPES.POLICE_FLOOR:
                        fillColor = '#475569';
                        break;
                    case TILE_TYPES.WORKSHOP_FLOOR:
                        fillColor = '#78350f';
                        break;
                    case TILE_TYPES.RESIDENTIAL_FLOOR:
                        fillColor = '#9a3412';
                        break;
                    case TILE_TYPES.MILITARY_FLOOR:
                        fillColor = '#1e293b';
                        break;
                    case TILE_TYPES.PLAZA_PAVER:
                        fillColor = '#334155';
                        break;
                    case TILE_TYPES.CONCRETE:
                        fillColor = ((x + y) % 2 === 0) ? '#777b80' : '#85898e';
                        strokeColor = '#62666a';
                        break;
                    case TILE_TYPES.DOORWAY:
                        fillColor = '#f59e0b';
                        break;
                    default:
                        fillColor = ((x + y) % 2 === 0) ? '#141416' : '#1c1c1f';
                        break;
                }

                // Natural ground is rendered without checkerboard tile borders.
                // Transition colors are blended across neighboring cells so biome seams read as terrain, not patches.
                if ([TILE_TYPES.FOREST_FLOOR, TILE_TYPES.GRASSLAND, TILE_TYPES.WASTELAND,
                    TILE_TYPES.DESERT, TILE_TYPES.SNOW, TILE_TYPES.MOUNTAIN].includes(tileType)) {
                    const baseTerrain = {
                        [TILE_TYPES.FOREST_FLOOR]: '#25452d', [TILE_TYPES.GRASSLAND]: '#4f7e38',
                        [TILE_TYPES.WASTELAND]: '#907d52', [TILE_TYPES.DESERT]: '#c0a062',
                        [TILE_TYPES.SNOW]: '#cbdff1', [TILE_TYPES.MOUNTAIN]: '#96a6ad'
                    }[tileType];
                    fillColor = this.terrainBlendColors.get(`${x},${y}`) || baseTerrain;
                    strokeColor = 'rgba(0, 0, 0, 0.025)';
                }

                IsoEngine.drawTile(ctx, sx, sy, fillColor, strokeColor);
                if (tileType === TILE_TYPES.MOUNTAIN) {
                    IsoEngine.drawIsoBlock(ctx, sx, sy, 22, '#a7b6bd', '#899ba3', '#647780');
                }
                if (tileType === TILE_TYPES.RIVER_BRIDGE) {
                    ctx.strokeStyle = 'rgba(180, 130, 65, 0.9)';
                    ctx.lineWidth = 2;
                    for (const plankOffset of [-4, 0, 4]) {
                        ctx.beginPath(); ctx.moveTo(sx - 7, sy + plankOffset - 2); ctx.lineTo(sx + 7, sy + plankOffset + 2); ctx.stroke();
                    }
                }

                const isCenterLine = (x === 41 || x === 69 || y === 41 || y === 69);
                if (tileType === TILE_TYPES.ROAD && isCenterLine && (x + y) % 3 === 0) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                    ctx.fillRect(sx - 3, sy - 2, 6, 4);
                }
            }
        }

        for (const crop of this.growingCrops) {
            const { x: sx, y: sy } = IsoEngine.worldToScreen(crop.x, crop.y, 0, camera);
            if (!IsoEngine.isVisible(sx, sy, 32, canvasW, canvasH)) continue;
            ctx.font = `${14 + crop.growth * 10}px sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText(crop.cropType === 'crop_pumpkin' ? '🌿' : '🌱', sx, sy - 4);
        }
    }

    /**
     * 繪製單塊 2.5D 立體牆壁
     */
    renderWall(ctx, camera, x, y, height = ISO_CONFIG.WALL_HEIGHT) {
        const { x: sx, y: sy } = IsoEngine.worldToScreen(x, y, 0, camera);
        if (!IsoEngine.isVisible(sx, sy, 90, ctx.canvas.width, ctx.canvas.height)) {
            return;
        }

        IsoEngine.drawIsoBlock(ctx, sx, sy, height, '#475569', '#334155', '#1e293b');
        ctx.fillStyle = '#64748b';
        ctx.fillRect(sx - 2, sy - height - 3, 4, 3);
    }

    renderScenery(ctx, camera, prop, z = 0) {
        const { x: sx, y: sy } = IsoEngine.worldToScreen(prop.x, prop.y, z, camera);
        if (!IsoEngine.isVisible(sx, sy, 64, ctx.canvas.width, ctx.canvas.height)) return;
        ctx.save();
        if (prop.type === 'tree') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath(); ctx.ellipse(sx, sy, 18, 8, 0, 0, Math.PI * 2); ctx.fill();
            if (prop.species === 'pine') {
                ctx.fillStyle = '#713f12'; ctx.fillRect(sx - 3, sy - 22, 6, 24);
                ctx.fillStyle = '#14532d';
                for (const [baseY, halfW] of [[-34, 18], [-48, 14], [-60, 9]]) {
                    ctx.beginPath(); ctx.moveTo(sx, sy + baseY - 16); ctx.lineTo(sx - halfW, sy + baseY + 6); ctx.lineTo(sx + halfW, sy + baseY + 6); ctx.closePath(); ctx.fill();
                }
                ctx.fillStyle = 'rgba(219, 234, 254, 0.8)'; ctx.beginPath(); ctx.moveTo(sx, sy - 72); ctx.lineTo(sx - 4, sy - 61); ctx.lineTo(sx + 4, sy - 61); ctx.closePath(); ctx.fill();
                ctx.restore(); return;
            }
            if (prop.species === 'palm') {
                ctx.strokeStyle = '#92400e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx - 3, sy - 27, sx + 2, sy - 48); ctx.stroke();
                ctx.strokeStyle = '#166534'; ctx.lineWidth = 4;
                for (let i = 0; i < 7; i++) { const a = Math.PI * 2 * i / 7; ctx.beginPath(); ctx.moveTo(sx + 2, sy - 46); ctx.quadraticCurveTo(sx + Math.cos(a) * 12, sy - 62, sx + Math.cos(a) * 24, sy - 52 + Math.sin(a) * 8); ctx.stroke(); }
                ctx.restore(); return;
            }
            ctx.fillStyle = '#713f12'; ctx.fillRect(sx - 4, sy - 28, 8, 30);
            ctx.fillStyle = '#166534';
            ctx.beginPath(); ctx.arc(sx, sy - 42, 19, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#15803d';
            ctx.beginPath(); ctx.arc(sx - 12, sy - 36, 12, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(sx + 12, sy - 36, 12, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(187, 247, 208, 0.2)';
            ctx.beginPath(); ctx.arc(sx - 5, sy - 47, 6, 0, Math.PI * 2); ctx.fill();
        } else if (prop.type === 'barbed_wire') {
            ctx.strokeStyle = '#3f4544'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(sx - 15, sy - 8); ctx.lineTo(sx + 15, sy - 8);
            ctx.moveTo(sx - 15, sy - 4); ctx.lineTo(sx + 15, sy - 4); ctx.stroke();
            ctx.strokeStyle = '#8b9290'; ctx.lineWidth = 1;
            for (let dx = -12; dx <= 12; dx += 8) {
                ctx.beginPath(); ctx.moveTo(sx + dx - 3, sy - 11); ctx.lineTo(sx + dx + 3, sy - 1);
                ctx.moveTo(sx + dx + 3, sy - 11); ctx.lineTo(sx + dx - 3, sy - 1); ctx.stroke();
            }
        } else if (prop.type === 'camp_tent') {
            ctx.fillStyle = '#776443'; ctx.strokeStyle = '#3d3324'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(sx - 17, sy); ctx.lineTo(sx, sy - 24); ctx.lineTo(sx + 18, sy); ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#413b2d'; ctx.beginPath(); ctx.moveTo(sx - 5, sy); ctx.lineTo(sx, sy - 12); ctx.lineTo(sx + 6, sy); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#c2ad7b'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(sx - 22, sy + 2); ctx.lineTo(sx + 22, sy + 2); ctx.stroke();
        } else if (prop.type === 'cold_campfire') {
            ctx.fillStyle = '#77746c'; ctx.beginPath(); ctx.ellipse(sx, sy - 1, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#282521'; ctx.beginPath(); ctx.ellipse(sx, sy - 2, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#493628'; ctx.lineWidth = 3; ctx.beginPath();
            ctx.moveTo(sx - 7, sy - 4); ctx.lineTo(sx + 7, sy + 3); ctx.moveTo(sx - 6, sy + 3); ctx.lineTo(sx + 6, sy - 4); ctx.stroke();
            ctx.fillStyle = '#b8afa0'; ctx.beginPath(); ctx.arc(sx - 2, sy - 4, 1.5, 0, Math.PI * 2); ctx.fill();
        } else if (prop.type === 'rubble') {
            ctx.fillStyle = '#766957';
            for (const [dx, dy, w, h] of [[-8, -1, 6, 3], [1, -4, 5, 4], [7, 1, 7, 3], [-2, 2, 4, 3]]) {
                ctx.fillRect(sx + dx, sy + dy, w, h);
            }
            ctx.strokeStyle = '#4c4439'; ctx.lineWidth = 1; ctx.strokeRect(sx - 8, sy - 1, 6, 3);
        } else if (prop.type === 'grass_tuft') {
            ctx.strokeStyle = '#4d7c0f'; ctx.lineWidth = 2;
            for (const [dx, height] of [[-5, 8], [-2, 12], [2, 9], [5, 7]]) {
                ctx.beginPath(); ctx.moveTo(sx + dx, sy); ctx.quadraticCurveTo(sx + dx - 2, sy - height / 2, sx + dx + 1, sy - height); ctx.stroke();
            }
        } else if (prop.type === 'coal_vein') {
            IsoEngine.drawIsoBlock(ctx, sx, sy, 12, '#475569', '#334155', '#1e293b');
            ctx.fillStyle = '#111827';
            for (const [ox, oy, r] of [[-5, -9, 4], [2, -12, 4], [7, -6, 3]]) { ctx.beginPath(); ctx.arc(sx + ox, sy + oy, r, 0, Math.PI * 2); ctx.fill(); }
            ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx - 7, sy - 8); ctx.lineTo(sx - 3, sy - 13); ctx.stroke();
        } else if (prop.type === 'timber_stack') {
            IsoEngine.drawIsoBlock(ctx, sx, sy, 13, '#92400e', '#713f12', '#542e0c');
            ctx.strokeStyle = '#d6a45b'; ctx.lineWidth = 2;
            for (let row = 0; row < 3; row++) { ctx.beginPath(); ctx.moveTo(sx - 10, sy - 12 + row * 4); ctx.lineTo(sx + 10, sy - 12 + row * 4); ctx.stroke(); }
        } else if (prop.type === 'crane') {

/**
 * js/entities/Entity.js
 * 2.5D 實體抽象基類
 */
class Entity {
    constructor(x = 0, y = 0, z = 0, radius = 0.4) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.radius = radius;
        this.isActive = true;
    }

    /**
     * 計算 2.5D 深度鍵值以進行正確繪製遮擋排序
     */
    get isoDepth() {
        return IsoEngine.getDepth(this.x, this.y, this.z * 0.1);
    }

    /**
     * 計算與另一實體或點的二維歐氏世界距離
     * @param {{x: number, y: number}} target 
     * @returns {number}
     */
    distanceTo(target) {
        const dx = target.x - this.x;
        const dy = target.y - this.y;
        return Math.hypot(dx, dy);
    }

    /**
     * 計算朝向目標的角度（弧度）
     * @param {{x: number, y: number}} target 
     * @returns {number}
     */
    angleTo(target) {
        return Math.atan2(target.y - this.y, target.x - this.x);
    }
}

/**
 * js/entities/Bullet.js
 * 槍械子彈飛行軌跡、擊退力與貫穿碰撞實體
 */
class Bullet extends Entity {
    constructor({ x, y, z = 0.4, angle, speed = 20, damage = 35, range = 14, shooter = 'player' }) {
        super(x, y, z, 0.15);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.damage = damage;
        this.range = range;
        this.traveled = 0;
        this.shooter = shooter;
    }

    /**
     * 子彈物理推進
     * @param {number} dt 
     * @param {object} cityMap 
     * @returns {boolean} 若撞牆或超出射程則返回 false (標記銷毀)
     */
    update(dt, cityMap) {
        if (!this.isActive) return false;

        const stepX = this.vx * dt;
        const stepY = this.vy * dt;
        const dist = Math.hypot(stepX, stepY);

        this.x += stepX;
        this.y += stepY;
        this.traveled += dist;

        // 撞擊實體牆壁銷毀
        if (cityMap.isProjectileBlocked(this.x, this.y)) {
            this.isActive = false;
            return false;
        }

        // 超出最大射程銷毀
        if (this.traveled >= this.range) {
            this.isActive = false;
            return false;
        }

        return true;
    }

    /**
     * 繪製高亮曳光彈軌跡
     * @param {CanvasRenderingContext2D} ctx 
     * @param {{x: number, y: number}} camera 
     */
    render(ctx, camera) {
        const { x: sx, y: sy } = IsoEngine.worldToScreen(this.x, this.y, this.z, camera);
        if (!IsoEngine.isVisible(sx, sy, 30, ctx.canvas.width, ctx.canvas.height)) {
            return;
        }

        ctx.save();
        ctx.fillStyle = '#fef08a';
        ctx.shadowColor = '#eab308';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}
